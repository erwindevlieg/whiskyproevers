<script>
const VAT_ORDER = ["Oloroso","PX","Sherry","Bourbon","Wijn","Port","Rum","Cognac/Armagnac","Virgin oak","Gemengd"];
const ROOK_ORDER = ["geen","licht","medium","zwaar"];
const REGIO_ORDER = ["Speyside","Highland","Islay","Lowland","Campbeltown","Orkney","Arran","Mull","Islands","Ierland","Taiwan","Japan","Kentucky","Canada","Nederland","Denemarken","België"];
const FLAVOUR = [
  { id: "fruitig", label: "Fruitig", re: /fruit|appel|\bpeer\b|perzik|pruim|kers|\bbes\b|bessen|braam|sinaasappel|citrus|citroen|sinaas|abrikoos|herfstfruit|\borange\b|berry|cherry|\bplum\b|\bapple\b|peach|lemon sherbet|citruszeste|citrusschil|gestoofd fruit/i },
  { id: "zoet", label: "Zoet", re: /zoet|toffee|karamel|caramel|fudge|marshmallow|siroop|syrup|sherbet|honingraat|kerstcake|toffee-app|snoepzoet/i },
  { id: "sherryfruit", label: "Sherry / gedroogd fruit", re: /sherry|rozijn|vijg|vijgen|\bdadel|\bdadels|sultana|krent|gedroogd fruit|raisin|kerstcake|rum-rozijn/i },
  { id: "kruidig", label: "Kruidig", re: /kruid|kaneel|nootmuskaat|gember|peper|kruidnagel|gingerbread|nutmeg|cinnamon|clove|\bpepper\b|glühwein|kaneelpap/i },
  { id: "vanille", label: "Vanille / honing", re: /vanille|vanilla|honing|\bhoney\b|honingraat|honingvanille/i },
  { id: "tropisch", label: "Tropisch", re: /tropisch|ananas|mango|kokos|coconut|pineapple|banaan|banana|papaya|guave|passievrucht/i },
  { id: "chocolade", label: "Chocolade / koffie", re: /chocolade|chocolate|mokka|mocha|koffie|coffee|cacao|cocoa|espresso/i },
  { id: "turfrook", label: "Turf / rook", re: /geturfd|turf|rokerig|gerookt|\bpeat\b|\bsmoky\b|\bsmoke\b|fenol/i },
  { id: "maritiem", label: "Maritiem", re: /zilt|zeezout|\bzout\b|\bzee\b|maritime|\bsea\b|iodine|jodium|zeewier|kelp|brine|zilte/i }
];
const PAGE_SIZE = 80;
const STORAGE_KEY = "whisky-tool-geproefd";
const COMPARE_KEY = "whisky-tool-vergelijk";
const THEME_KEY = "whisky-tool-theme";
const VIEW_KEY = "whisky-tool-weergave";
const COMPARE_MAX = 3;
const ROOK_SCALE = { geen: 0, licht: 1 / 3, medium: 2 / 3, zwaar: 1 };
const rookOrder = { geen: 0, licht: 1, medium: 2, zwaar: 3, onbekend: 4 };

function parseRegio(regio) {
  if (!regio) return null;
  const head = regio.split(/[,—]/)[0].trim().toLowerCase();
  if (/^onbekend\b/.test(head)) return null;
  const map = [
    ["isle of mull","Mull"],["campbeltown","Campbeltown"],["speyside","Speyside"],
    ["islay","Islay"],["orkney","Orkney"],["highland","Highland"],
    ["ierland","Ierland"],["lowland","Lowland"],["taiwan","Taiwan"],["japan","Japan"],
    ["isle of arran","Arran"],["arran","Arran"],["islands","Islands"],
    ["kentucky","Kentucky"],["canada","Canada"],["nederland","Nederland"],
    ["denemarken","Denemarken"],["belgië","België"],["belgie","België"],
    ["bourbon","Kentucky"],["mull","Mull"]
  ];
  for (const [k,v] of map) if (head.includes(k)) return v;
  return null;
}

function deriveVat(vattype) {
  if (!vattype) return [];
  let t = vattype.toLowerCase();
  t = t.replace(/niet[\s-]*sherry\w*/g, " ");
  if (/^onbekend( vattype)?\b/.test(t) && !/(oloroso|sherry|bourbon|\bpx\b|port)/.test(t)) return [];
  const tags = [];
  if (/oloroso/.test(t)) tags.push("Oloroso");
  if (/pedro xim[eé]nez|ximenez|\bpx\b|px-/.test(t)) tags.push("PX");
  if (/bourbon/.test(t)) tags.push("Bourbon");
  if (/\bport\b|tawny|colheita|ruby port/.test(t)) tags.push("Port");
  if (/\brum\b/.test(t)) tags.push("Rum");
  if (/rode wijn|red wine|witte wijn|white wine|barolo|burgundy|bordeaux|sauternes|madeira|marsala|tokaji|pineau|rioja|syrah/.test(t)) tags.push("Wijn");
  if (/cognac|armagnac/.test(t)) tags.push("Cognac/Armagnac");
  if (/virgin oak|nieuw eiken/.test(t)) tags.push("Virgin oak");
  if (/sherry/.test(t) && !tags.includes("Oloroso") && !tags.includes("PX")) tags.push("Sherry");
  if (tags.length >= 2) tags.push("Gemengd");
  return tags;
}

function flavourTags(r) {
  const notes = unknownToEmpty(r.proefnotities);
  const vat = (r.vattype || "").replace(/niet[\s-]*sherry\w*/gi, " ");
  const regio = (r.regio || "").replace(/ongeturfd\w*/gi, " ");
  const text = [notes, vat, regio].join(" ");
  const peatText = [notes, vat, regio].join(" ").replace(/ongeturfd\w*/gi, " ");
  const tags = [];
  for (const f of FLAVOUR) {
    if (f.id === "turfrook") {
      if (["licht","medium","zwaar"].includes(r.rook) || f.re.test(peatText)) tags.push(f.label);
      continue;
    }
    if (f.id === "sherryfruit") {
      const vatTags = deriveVat(r.vattype);
      if (vatTags.includes("Oloroso") || vatTags.includes("PX") || vatTags.includes("Sherry") || f.re.test(notes) || f.re.test(vat)) {
        tags.push(f.label);
      }
      continue;
    }
    if (f.re.test(text)) tags.push(f.label);
  }
  return tags;
}

function unknownToEmpty(value) {
  if (value == null) return "";
  const text = String(value).trim();
  if (!text || /^onbekend\b/i.test(text)) return "";
  return text;
}

function enrich(r) {
  return {
    ...r,
    vatTags: deriveVat(r.vattype),
    flavour: flavourTags(r),
    regioKort: parseRegio(r.regio)
  };
}

const euro = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
const num = new Intl.NumberFormat("nl-NL", { minimumFractionDigits: 1, maximumFractionDigits: 2 });
const scoreFmt = new Intl.NumberFormat("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const intFmt = new Intl.NumberFormat("nl-NL");

function displayName(naam) {
  return naam
    .replace(/\s+\d+\s*CL\s+Sample\s*$/i, "")
    .replace(/\s+\d+(?:[.,]\d+)?%\s*$/, "")
    .trim();
}
function rowId(r) { return r.naam + "|" + (r.inhoud || "fles"); }
function detailHref(r) { return "#/whisky/" + encodeURIComponent(r.id); }
function loadTasted() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { return {}; }
}
function saveTasted(map) { localStorage.setItem(STORAGE_KEY, JSON.stringify(map)); }
function loadCompare() {
  try {
    const ids = JSON.parse(localStorage.getItem(COMPARE_KEY) || "[]");
    return Array.isArray(ids) ? ids.filter(id => typeof id === "string") : [];
  } catch { return []; }
}
function saveCompare(ids) { localStorage.setItem(COMPARE_KEY, JSON.stringify(ids)); }

const state = {
  q: "",
  vat: new Set(),
  rook: new Set(),
  regio: new Set(),
  smaak: new Set(),
  minScore: 60,
  maxPrijs: 100,
  inclOnbekend: true,
  sampleAvail: "alle",
  flesPrijsBekend: "alle",
  sort: "score",
  dir: "desc",
  shown: PAGE_SIZE,
  tasted: loadTasted(),
  compare: loadCompare(),
  defaults: { minScore: 60, maxPrijs: 100, scoreMin: 60, scoreMax: 92, prijsMin: 1, prijsMax: 100 }
};

let ROWS = [];
let listScroll = null;
let DESCRIPTIONS = null;
let descriptionsPromise = null;

function loadDescriptions() {
  if (DESCRIPTIONS) return Promise.resolve(DESCRIPTIONS);
  if (!descriptionsPromise) {
    descriptionsPromise = fetch("descriptions.json")
      .then(res => res.ok ? res.json() : {})
      .then(data => { DESCRIPTIONS = data || {}; return DESCRIPTIONS; })
      .catch(() => { DESCRIPTIONS = {}; return DESCRIPTIONS; });
  }
  return descriptionsPromise;
}

function descriptionFor(r) {
  if (r.omschrijving) return { text: r.omschrijving, sourceUrl: r.omschrijvingBron || "" };
  const entry = DESCRIPTIONS && DESCRIPTIONS[r.id];
  if (entry && entry.text) return entry;
  return null;
}

function photoUrl(r) {
  const url = r && r.afbeelding;
  return url && String(url).startsWith("https://") ? String(url) : "";
}

function photoHtml(r, size, alt) {
  const cls = "photo photo-" + size;
  const url = photoUrl(r);
  const placeholder = '<span class="photo-placeholder" aria-hidden="true"></span>';
  if (!url) return '<div class="' + cls + ' is-empty" aria-hidden="true">' + placeholder + "</div>";
  const label = alt == null ? displayName(r.naam) : alt;
  return '<div class="' + cls + ' is-loading">'
    + '<img src="' + escapeAttr(url) + '" alt="' + escapeAttr(label) + '" loading="lazy" decoding="async">'
    + "</div>";
}

function bindPhotos(root) {
  (root || document).querySelectorAll(".photo img").forEach(img => {
    const box = img.parentNode;
    const done = () => box.classList.remove("is-loading");
    const fail = () => {
      box.classList.remove("is-loading");
      box.classList.add("is-empty");
      box.innerHTML = '<span class="photo-placeholder" aria-hidden="true"></span>';
    };
    if (img.complete && img.naturalWidth) done();
    else if (img.complete) fail();
    else {
      img.addEventListener("load", done, { once: true });
      img.addEventListener("error", fail, { once: true });
    }
  });
}

const REGIO_CHIP = {
  Speyside: "speyside", Highland: "highland", Islay: "islay", Lowland: "lowland",
  Campbeltown: "campbeltown", Orkney: "orkney", Arran: "arran", Mull: "mull",
  Islands: "islands", Ierland: "ierland", Taiwan: "taiwan", Japan: "japan",
  Kentucky: "kentucky", Canada: "canada", Nederland: "nederland",
  Denemarken: "denemarken", België: "belgie"
};

function vatChipsHtml(r) {
  const tags = r.vatTags || [];
  const shown = tags.filter(t => t !== "Gemengd");
  const list = shown.length ? shown : tags;
  return list.map(t => {
    const key = VAT_CHIP[t] || "gemengd";
    return '<span class="chip chip-vat" data-chip="' + key + '">' + escapeHtml(t) + "</span>";
  }).join("");
}

function regioChipHtml(r) {
  if (!r.regioKort) return "";
  const key = REGIO_CHIP[r.regioKort] || "regio";
  return '<span class="chip chip-regio" data-chip="' + key + '">' + escapeHtml(r.regioKort) + "</span>";
}

function heroTone(r) {
  const tags = r.vatTags || [];
  const order = ["PX", "Oloroso", "Sherry", "Port", "Bourbon", "Wijn", "Rum", "Cognac/Armagnac", "Virgin oak"];
  const map = {
    PX: "px", Oloroso: "sherry", Sherry: "sherry", Port: "port",
    Bourbon: "bourbon", Wijn: "wijn", Rum: "rum",
    "Cognac/Armagnac": "cognac", "Virgin oak": "oak"
  };
  for (const t of order) if (tags.includes(t)) return map[t];
  return "neutral";
}

function currentTheme() {
  try { return localStorage.getItem(THEME_KEY) || "system"; }
  catch { return "system"; }
}

function resolvedTheme(pref) {
  const t = pref || currentTheme();
  if (t === "light" || t === "dark") return t;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function themeIcon(theme) {
  if (theme === "light") {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5.05 5.05l1.4 1.4M17.55 17.55l1.4 1.4M3 12h2M19 12h2M5.05 18.95l1.4-1.4M17.55 6.45l1.4-1.4"/></svg>';
  }
  if (theme === "dark") {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3.5A9 9 0 1 0 20.5 15 7 7 0 0 1 15 3.5z"/></svg>';
  }
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>';
}

function applyTheme(pref, opts) {
  const theme = pref || currentTheme();
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
  const resolved = resolvedTheme(theme);
  document.documentElement.classList.toggle("dark", resolved === "dark");
  document.documentElement.style.colorScheme = resolved;
  const btn = els.themeBtn || document.getElementById("themeBtn");
  if (btn) {
    const label = theme === "light" ? "licht" : theme === "dark" ? "donker" : "systeem";
    btn.setAttribute("data-theme", theme);
    btn.setAttribute("aria-label", "Thema: " + label + ". Klik om te wisselen");
    btn.innerHTML = themeIcon(theme);
  }
  if (opts && opts.rerender) rerenderOpenCharts();
}

function cycleTheme() {
  const order = ["system", "light", "dark"];
  const i = order.indexOf(currentTheme());
  applyTheme(order[(i + 1) % 3], { rerender: true });
}

function currentView() {
  try { return localStorage.getItem(VIEW_KEY) === "grid" ? "grid" : "lijst"; }
  catch { return "lijst"; }
}

function applyView(mode) {
  const view = mode === "grid" ? "grid" : "lijst";
  try { localStorage.setItem(VIEW_KEY, view); } catch {}
  document.documentElement.classList.toggle("view-grid", view === "grid");
  if (els.viewList) els.viewList.setAttribute("aria-pressed", view === "lijst" ? "true" : "false");
  if (els.viewGrid) els.viewGrid.setAttribute("aria-pressed", view === "grid" ? "true" : "false");
}

function revealView(el) {
  if (!el) return;
  el.hidden = false;
  el.classList.remove("view-enter");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  void el.offsetWidth;
  el.classList.add("view-enter");
}

function isCompared(id) { return state.compare.includes(id); }

function toggleCompare(id) {
  if (!id) return;
  const i = state.compare.indexOf(id);
  if (i >= 0) state.compare.splice(i, 1);
  else if (state.compare.length < COMPARE_MAX) state.compare.push(id);
  saveCompare(state.compare);
  updateCompareBar();
}

function compareHref(ids) {
  const list = ids || state.compare;
  return "#/vergelijk/" + list.map(encodeURIComponent).join(",");
}

function compareToggleHtml(r) {
  const on = isCompared(r.id);
  const full = !on && state.compare.length >= COMPARE_MAX;
  return '<button type="button" class="compare-toggle" data-compare-id="' + escapeAttr(r.id) + '"'
    + ' aria-pressed="' + (on ? "true" : "false") + '"'
    + (full ? " disabled" : "")
    + (on ? ' aria-label="Verwijder uit vergelijking"' : ' aria-label="Zet op vergelijking"')
    + ">" + (on ? "Geselecteerd" : "Vergelijk") + "</button>";
}

function rowById(id) { return ROWS.find(r => r.id === id); }

function updateCompareBar() {
  // drop ids that disappeared after a data refresh
  state.compare = state.compare.filter(id => !ROWS.length || rowById(id));
  const n = state.compare.length;
  if (!els.compareBar) return;
  els.compareBar.hidden = n === 0;
  document.body.classList.toggle("has-compare-bar", n > 0);
  els.compareGo.disabled = n < 2;
  els.compareGo.textContent = n ? "Vergelijk (" + n + ")" : "Vergelijk";
  els.comparePicks.innerHTML = state.compare.map(id => {
    const r = rowById(id);
    const name = r ? displayName(r.naam) : id;
    return '<span class="compare-chip"><span>' + escapeHtml(name) + '</span>'
      + '<button type="button" data-compare-remove="' + escapeAttr(id) + '" aria-label="Verwijder ' + escapeAttr(name) + '">×</button></span>';
  }).join("");
}

function canHoverPreview() {
  return window.matchMedia("(hover: hover) and (pointer: fine)").matches;
}

function hideHoverCard() {
  if (els.hoverCard) els.hoverCard.hidden = true;
}

function showHoverCard(r, anchor) {
  if (!canHoverPreview() || !els.hoverCard || !r) return;
  const tags = r.flavour.slice(0, 4).map(t => '<span class="tag">' + escapeHtml(t) + "</span>").join("");
  const chips = regioChipHtml(r) + vatChipsHtml(r);
  const vat = unknownToEmpty(r.vattype);
  els.hoverCard.innerHTML =
    '<div class="hover-top">' + photoHtml(r, "sm", "")
    + '<div><a class="name" href="' + escapeAttr(detailHref(r)) + '">' + escapeHtml(displayName(r.naam)) + "</a>"
    + (r.score != null ? '<div>' + scoreBadge(r.score) + "</div>" : "")
    + "</div></div>"
    + (chips ? '<div class="chips">' + chips + "</div>" : "")
    + (vat ? '<p class="sub">' + escapeHtml(vat) + "</p>" : "")
    + (tags ? '<div class="tags">' + tags + "</div>" : "");
  els.hoverCard.hidden = false;
  bindPhotos(els.hoverCard);
  const rect = anchor.getBoundingClientRect();
  const card = els.hoverCard.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 8;
  if (left + card.width > window.innerWidth - 8) left = window.innerWidth - card.width - 8;
  if (left < 8) left = 8;
  if (top + card.height > window.innerHeight - 8) top = Math.max(8, rect.top - card.height - 8);
  els.hoverCard.style.left = left + "px";
  els.hoverCard.style.top = top + "px";
}

function flavourAxes(r) {
  const axes = FLAVOUR.map(f => ({ label: f.label, value: r.flavour.includes(f.label) ? 1 : 0 }));
  if (r.rook && Object.prototype.hasOwnProperty.call(ROOK_SCALE, r.rook)) {
    axes.push({ label: "Rook", value: ROOK_SCALE[r.rook] });
  }
  return axes;
}

function flavourChartHtml(r) {
  const axes = flavourAxes(r);
  const any = axes.some(a => a.value > 0);
  if (!any) return "";
  const n = axes.length;
  const cx = 150, cy = 150, radius = 86;
  const levels = [0.25, 0.5, 0.75, 1];
  const toPt = (i, value) => {
    const angle = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    return [cx + Math.cos(angle) * radius * value, cy + Math.sin(angle) * radius * value];
  };
  const grid = levels.map(lv => {
    const pts = Array.from({ length: n }, (_, i) => toPt(i, lv).join(",")).join(" ");
    return '<polygon class="chart-grid" points="' + pts + '"></polygon>';
  }).join("");
  const spokes = axes.map((_, i) => {
    const [x, y] = toPt(i, 1);
    return '<line class="chart-axis" x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '"></line>';
  }).join("");
  const poly = axes.map((a, i) => toPt(i, a.value).join(",")).join(" ");
  const labels = axes.map((a, i) => {
    const [x, y] = toPt(i, 1.24);
    const anchor = x < cx - 8 ? "end" : x > cx + 8 ? "start" : "middle";
    const parts = a.label.split(" / ");
    if (parts.length > 1) {
      const y0 = y < cy ? -0.7 : (y > cy ? 0.2 : -0.35);
      return '<text class="chart-label" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + anchor + '" dy="' + y0 + 'em">'
        + '<tspan x="' + x.toFixed(1) + '">' + escapeHtml(parts[0]) + '</tspan>'
        + '<tspan x="' + x.toFixed(1) + '" dy="1.15em">' + escapeHtml(parts.slice(1).join(" / ")) + '</tspan>'
        + "</text>";
    }
    const dy = y < cy - 8 ? "-0.2em" : y > cy + 8 ? "0.8em" : "0.35em";
    return '<text class="chart-label" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + anchor + '" dy="' + dy + '">'
      + escapeHtml(a.label) + "</text>";
  }).join("");
  const dots = axes.map((a, i) => {
    const [x, y] = toPt(i, a.value);
    return '<circle class="chart-point" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4"></circle>';
  }).join("");
  const scale = levels.map(lv => {
    const y = cy - radius * lv;
    return '<text class="chart-scale" x="' + (cx + 5) + '" y="' + y.toFixed(1) + '" dy="0.35em">' + String(lv) + "</text>";
  }).join("");
  const top = axes.map((a, i) => ({ label: a.label, value: a.value, i }))
    .filter(a => a.value > 0)
    .sort((a, b) => b.value - a.value || (b.label === "Rook" ? 1 : 0) - (a.label === "Rook" ? 1 : 0) || a.i - b.i)
    .slice(0, 3);
  const topHtml = top.length
    ? '<div class="chart-top">' + top.map(a => {
        const label = a.label === "Rook" && r.rook ? ("Rook · " + r.rook) : a.label;
        return '<span class="chip chip-flavour">' + escapeHtml(label) + "</span>";
      }).join("") + "</div>"
    : "";
  return '<div class="chart-block"><h3>Smaakprofiel</h3>'
    + '<p class="chart-caption">Op basis van tags</p>'
    + '<div class="radar-wrap"><svg viewBox="-16 -14 332 332" role="img" aria-label="Smaakprofiel op basis van tags">'
    + grid + spokes + scale
    + '<polygon class="chart-fill" points="' + poly + '"></polygon>'
    + dots + labels + "</svg></div>"
    + topHtml + "</div>";
}

function renderInzicht() {
  document.title = "Inzicht · Whisky proefoverzicht";
  const points = ROWS.filter(r => r.score != null && r.prijsSample != null);
  if (!points.length) {
    els.inzicht.innerHTML = "<h2>Score vs sampleprijs</h2><p class=\"sub\">Geen rijen met zowel een score als een sampleprijs.</p>";
    return;
  }
  const padL = 48, padR = 16, padT = 16, padB = 40;
  const W = 720, H = 420;
  const xs = points.map(r => r.prijsSample), ys = points.map(r => r.score);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(0.01, maxX - minX);
  const spanY = Math.max(0.01, maxY - minY);
  const xOf = v => padL + ((v - minX) / spanX) * (W - padL - padR);
  const yOf = v => padT + (1 - (v - minY) / spanY) * (H - padT - padB);
  const ticksX = 5, ticksY = 5;
  let axis = '<line class="chart-axis" x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '"></line>'
    + '<line class="chart-axis" x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (H - padB) + '"></line>';
  for (let i = 0; i <= ticksX; i++) {
    const v = minX + (spanX * i) / ticksX;
    const x = xOf(v);
    axis += '<line class="chart-grid" x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (H - padB) + '"></line>';
    axis += '<text class="scatter-tick" x="' + x + '" y="' + (H - padB + 16) + '" text-anchor="middle">' + escapeHtml(euro.format(v).replace(",00", "")) + "</text>";
  }
  for (let i = 0; i <= ticksY; i++) {
    const v = minY + (spanY * i) / ticksY;
    const y = yOf(v);
    axis += '<line class="chart-grid" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '"></line>';
    axis += '<text class="scatter-tick" x="' + (padL - 8) + '" y="' + (y + 3) + '" text-anchor="end">' + escapeHtml(scoreFmt.format(v)) + "</text>";
  }
  const dots = points.map(r => {
    const label = displayName(r.naam) + " · " + scoreFmt.format(r.score) + " · " + euro.format(r.prijsSample);
    return '<circle class="scatter-point" data-slug="' + escapeAttr(r.id) + '" cx="' + xOf(r.prijsSample).toFixed(1) + '" cy="' + yOf(r.score).toFixed(1) + '" r="4" tabindex="0" role="link" aria-label="' + escapeAttr(label) + '"></circle>';
  }).join("");
  els.inzicht.innerHTML = "<h2>Score vs sampleprijs</h2>"
    + '<p class="chart-caption">Alleen bottelingen waarvan zowel de Whiskybase-score als de sampleprijs bekend is. Klik op een punt voor de detailpagina.</p>'
    + '<div class="scatter-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Spreidingsdiagram score versus sampleprijs">'
    + axis + dots
    + '<text class="chart-label" x="' + (W / 2) + '" y="' + (H - 4) + '" text-anchor="middle">Sampleprijs</text>'
    + '<text class="chart-label" x="14" y="' + (H / 2) + '" text-anchor="middle" transform="rotate(-90 14 ' + (H / 2) + ')">Score</text>'
    + '</svg><div class="chart-tooltip" id="chartTooltip" hidden role="tooltip"></div></div>';
}

function knownOrEmpty(valueHtml) { return valueHtml || ""; }

function compareValue(kind, r) {
  if (kind === "photo") return photoHtml(r, "md");
  if (kind === "score") return r.score != null ? scoreBadge(r.score) : "";
  if (kind === "abv") return abvCell(r);
  if (kind === "regio") return knownText(r.regioKort || r.regio);
  if (kind === "vattype") return knownText(r.vattype);
  if (kind === "rook") return knownText(r.rook);
  if (kind === "leeftijd") return r.leeftijd != null ? escapeHtml(String(r.leeftijd) + " jaar") : "";
  if (kind === "ncf") return knownText(ncfLabel(r.ncf) || r.ncf);
  if (kind === "kleurstof") return knownText(kleurLabel(r.kleurstof) || r.kleurstof);
  if (kind === "flavour") {
    return r.flavour.length ? r.flavour.map(t => '<span class="tag">' + escapeHtml(t) + "</span>").join(" ") : "";
  }
  if (kind === "prijsSample") return r.prijsSample != null ? escapeHtml(euro.format(r.prijsSample)) : "";
  if (kind === "flesPrijs") return r.flesPrijs != null ? escapeHtml(euro.format(r.flesPrijs)) : "";
  if (kind === "critics") {
    const parts = [];
    if (r.whiskyfunScore) parts.push("WF " + r.whiskyfunScore);
    if (r.distillerScore) parts.push("Distiller " + String(r.distillerScore).split("—")[0].trim());
    return parts.length ? escapeHtml(parts.join(" · ")) : "";
  }
  return "";
}

function isPresent(kind, r) { return !!compareValue(kind, r); }

function bestClass(kind, rows, index) {
  if (kind === "score") {
    const vals = rows.map(r => r.score).filter(v => v != null);
    if (!vals.length || rows[index].score == null) return "";
    return rows[index].score === Math.max(...vals) ? " is-best" : "";
  }
  if (kind === "prijsSample" || kind === "flesPrijs") {
    const key = kind;
    const vals = rows.map(r => r[key]).filter(v => v != null);
    if (!vals.length || rows[index][key] == null) return "";
    return rows[index][key] === Math.min(...vals) ? " is-best" : "";
  }
  return "";
}

function renderCompare(ids) {
  const rows = ids.map(rowById).filter(Boolean);
  document.title = "Vergelijk · Whisky proefoverzicht";
  if (rows.length < 2) {
    els.compare.innerHTML = '<div class="compare-missing"><h2>Vergelijking</h2><p>Selecteer twee of drie whisky’s om ze naast elkaar te zetten.</p></div>';
    return;
  }
  const fields = [
    ["photo", "Foto"],
    ["score", "WB-score"],
    ["abv", "ABV"],
    ["regio", "Regio"],
    ["vattype", "Vattype"],
    ["rook", "Rook"],
    ["leeftijd", "Leeftijd"],
    ["ncf", "NCF"],
    ["kleurstof", "Kleurstof"],
    ["flavour", "Smaak"],
    ["prijsSample", "Sampleprijs"],
    ["flesPrijs", "Flesprijs"],
    ["critics", "Andere scores"]
  ].filter(([kind]) => kind === "photo" || rows.some(r => isPresent(kind, r)));
  const head = '<tr><th class="cmp-label" scope="col"></th>'
    + rows.map(r => '<th scope="col"><div class="compare-head">' + photoHtml(r, "md")

    return '<tr><th class="cmp-label" scope="row">' + escapeHtml(label) + "</th>"
      + rows.map((r, i) => '<td class="' + bestClass(kind, rows, i).trim() + '">' + (compareValue(kind, r) || "—") + "</td>").join("")
      + "</tr>";
  }).join("");
  els.compare.innerHTML = "<h2>Vergelijking</h2><div class=\"compare-scroll\"><table class=\"compare-table\"><thead>"
    + head + "</thead><tbody>" + body + "</tbody></table></div>";
  bindPhotos(els.compare);
}

function uniqueInOrder(items, order) {
  const set = new Set(items.filter(Boolean));
  return order.filter(x => set.has(x)).concat([...set].filter(x => !order.includes(x)));
}

function makePills(container, values, group) {
  container.innerHTML = values.map(v =>
    '<button type="button" class="pill" data-group="' + group + '" data-value="' + escapeAttr(v) + '" aria-pressed="false">' + escapeHtml(labelFor(group, v)) + '</button>'
  ).join("");
}
function labelFor(group, v) {
  if (group === "rook") return v.charAt(0).toUpperCase() + v.slice(1);
  return v;
}

function vatMatch(rowTags, selected) {
  if (selected.size === 0) return true;
  return rowTags.some(t => {
    if (selected.has(t)) return true;
    if (selected.has("Sherry") && (t === "Oloroso" || t === "PX")) return true;
    return false;
  });
}

function priceFilterActive() {
  return state.maxPrijs < state.defaults.maxPrijs;
}

function matches(r) {
  if (r.score == null) {
    if (!state.inclOnbekend) return false;
  } else if (r.score < state.minScore) {
    return false;
  }
  if (priceFilterActive()) {
    if (r.prijsSample == null || r.prijsSample > state.maxPrijs) return false;
  } else if (r.prijsSample != null && r.prijsSample > state.maxPrijs) {
    return false;
  }
  if (!vatMatch(r.vatTags, state.vat)) return false;
  if (state.rook.size && !state.rook.has(r.rook)) return false;
  if (state.regio.size && !state.regio.has(r.regioKort)) return false;
  if (state.smaak.size && !r.flavour.some(t => state.smaak.has(t))) return false;
  if (state.sampleAvail === "ja" && r.sampleBeschikbaar !== "ja") return false;
  if (state.sampleAvail === "nee" && r.sampleBeschikbaar !== "nee") return false;
  if (state.flesPrijsBekend === "ja" && r.flesPrijs == null) return false;
  if (state.flesPrijsBekend === "nee" && r.flesPrijs != null) return false;
  if (state.q) {
    const hay = [
      r.naam, r.vattype, r.regio, r.winkel, r.tweedeWinkel, r.proefnotities,
      r.wbStatus, r.wbReden, r.whiskyfunScore, r.distillerScore, r.opmerkingFles,
      r.flavour.join(" "), r.vatTags.join(" ")
    ].join(" ").toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

function emptyLast(av, bv, a, b) {
  const aEmpty = av == null || av === "", bEmpty = bv == null || bv === "";
  if (aEmpty && bEmpty) return displayName(a.naam).localeCompare(displayName(b.naam), "nl");
  if (aEmpty) return 1;
  if (bEmpty) return -1;
  return null;
}

function cmp(a, b) {
  const key = state.sort;
  let av = a[key], bv = b[key];
  if (key === "naam") { av = displayName(a.naam).toLowerCase(); bv = displayName(b.naam).toLowerCase(); }
  if (key === "regio") { av = (a.regioKort || a.regio || "").toLowerCase(); bv = (b.regioKort || b.regio || "").toLowerCase(); }
  if (key === "vattype") { av = (a.vattype || "").toLowerCase(); bv = (b.vattype || "").toLowerCase(); }
  if (key === "rook") { av = rookOrder[a.rook] ?? 9; bv = rookOrder[b.rook] ?? 9; }
  if (key === "score" || key === "flesPrijs" || key === "prijsSample" || key === "inhoud" || key === "abv" || key === "vattype" || key === "regio") {
    const early = emptyLast(av, bv, a, b);
    if (early != null) return early;
  }
  let res;
  if (typeof av === "string" && typeof bv === "string") res = av.localeCompare(bv, "nl", { numeric: true });
  else res = (av ?? 0) - (bv ?? 0);
  if (res === 0) res = displayName(a.naam).localeCompare(displayName(b.naam), "nl");
  return state.dir === "asc" ? res : -res;
}

function scoreTier(score) {
  if (score == null) return "unknown";
  if (score >= 90) return "top";
  if (score >= 87) return "high";
  if (score >= 84) return "mid";
  return "low";
}

function scoreBadge(score, extraClass) {
  if (score == null) return "";
  const cls = "score-badge " + scoreTier(score) + (extraClass ? " " + extraClass : "");
  return '<span class="' + cls + '">' + scoreFmt.format(score) + "</span>";
}

function scoreCell(r) {
  if (r.score == null) return "";
  return scoreBadge(r.score)
    + (r.stemmen != null ? '<span class="votes">' + intFmt.format(r.stemmen) + " stemmen</span>" : "");
}

function criticLine(r) {
  const parts = [];
  if (r.whiskyfunScore) parts.push("WF " + r.whiskyfunScore);
  if (r.distillerScore) parts.push("Distiller " + String(r.distillerScore).split("—")[0].trim());
  return parts.length ? '<span class="crit">' + escapeHtml(parts.join(" · ")) + "</span>" : "";
}

function metaLine(r) {
  const abv = r.abv != null ? num.format(r.abv).replace(",0", "") + "%" : "";
  const extras = [];
  if (r.ncf === "ja") extras.push("NCF");
  else if (r.ncf === "nee") extras.push("koel gefilterd");
  if (r.kleurstof === "nee") extras.push("geen kleurstof");
  else if (r.kleurstof === "ja") extras.push("met kleurstof");
  return [abv, r.regioKort].concat(extras).filter(Boolean).join(" · ");
}

function abvCell(r) {
  return r.abv != null ? escapeHtml(num.format(r.abv).replace(",0", "") + "%") : "";
}

function activeFilterCount() {
  let n = state.vat.size + state.rook.size + state.regio.size + state.smaak.size;
  if (state.minScore > state.defaults.minScore) n += 1;
  if (priceFilterActive()) n += 1;
  if (!state.inclOnbekend) n += 1;
  if (state.sampleAvail !== "alle") n += 1;
  if (state.flesPrijsBekend !== "alle") n += 1;
  return n;
}

function updateFilterBadge() {
  const n = activeFilterCount();
  els.filterCount.hidden = n === 0;
  els.filterCount.textContent = n ? String(n) : "";
  if (els.resetInline) els.resetInline.hidden = n === 0;
  if (els.sheetApply) {
    const list = ROWS.filter(matches);
    els.sheetApply.textContent = "Toon " + intFmt.format(list.length) + " resultaten";
  }
}

function filtersOpen() {
  return els.filters.classList.contains("is-open");
}

function openFilters() {
  els.filters.classList.add("is-open");
  els.sheetBackdrop.hidden = false;
  els.filterBtn.setAttribute("aria-expanded", "true");
  document.body.classList.add("filters-open");
  els.sheetClose.focus();
}

function closeFilters() {
  els.filters.classList.remove("is-open");
  els.sheetBackdrop.hidden = true;
  els.filterBtn.setAttribute("aria-expanded", "false");
  document.body.classList.remove("filters-open");
}

function render(resetPage) {
  if (resetPage) state.shown = PAGE_SIZE;
  els.minScoreVal.textContent = num.format(state.minScore);
  els.maxPrijsVal.textContent = euro.format(state.maxPrijs).replace(",00", "");

  const list = ROWS.filter(matches).sort(cmp);

  let count = "<strong>" + intFmt.format(list.length) + "</strong> van <strong>" + intFmt.format(ROWS.length) + "</strong> bottelingen";
  if (visible.length < list.length) count += " · " + intFmt.format(visible.length) + " getoond";
  if (tastedN) count += " · " + intFmt.format(tastedN) + " geproefd";
  els.count.innerHTML = count;
  updateFilterBadge();

  els.rows.innerHTML = visible.map(r => {
    const id = rowId(r);
    const tasted = !!state.tasted[id];
    const name = displayName(r.naam);
    const notes = unknownToEmpty(r.proefnotities);

      + compareToggleHtml(r) + "</td>"

    : "Toon meer";

  document.querySelectorAll("thead th.sortable").forEach(th => {

function cardMeta(r) {
  const inhoud = r.inhoud || "";

}

function cardHtml(r) {

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function isUrl(value) {
  return /^https?:\/\//i.test(String(value || "").trim());
}

function knownText(value) {
  const text = unknownToEmpty(value);
  return text ? escapeHtml(text) : "";
}

function fact(label, valueHtml) {
  if (!valueHtml) return "";
  return '<div class="fact"><dt>' + escapeHtml(label) + "</dt><dd>" + valueHtml + "</dd></div>";
}

function ncfLabel(value) {
  if (value === "ja") return "ja (ongekoeld gefilterd)";
  if (value === "nee") return "nee (koel gefilterd)";
  return null;
}

function kleurLabel(value) {
  if (value === "ja") return "ja (met kleurstof)";
  if (value === "nee") return "nee (geen kleurstof)";
  return null;
}

function voorraadLabel(value) {
  if (value === "ja") return "Op voorraad";
  if (value === "nee") return "Niet op voorraad";
  return null;
}

function extLink(href, title, subtitle) {
  return '<a class="ext-link" href="' + escapeAttr(href) + '" target="_blank" rel="noopener noreferrer">'
    + escapeHtml(title)
    + (subtitle ? "<span>" + escapeHtml(subtitle) + "</span>" : "")
    + "</a>";
}

function collectLinks(r) {
  const links = [];
  const used = new Set();
  function add(href, title, subtitle) {
    if (!href || !isUrl(href) || used.has(href)) return;
    used.add(href);
    links.push(extLink(href, title, subtitle));
  }
  add(r.sampleLink, "Sample kopen", r.prijsSample != null ? ("Whiskysite · " + euro.format(r.prijsSample)) : "Whiskysite");
  add(r.flesLink, "Fles kopen" + (r.winkel ? " bij " + r.winkel : ""), r.flesPrijs != null ? euro.format(r.flesPrijs) : null);
  add(r.tweedeLink, "Fles bij " + (r.tweedeWinkel || "tweede winkel"), r.tweedePrijs != null ? euro.format(r.tweedePrijs) : null);
  add(r.wbLink, "Whiskybase", r.score != null ? ("Score " + scoreFmt.format(r.score)) : null);
  add(r.whiskyfunLink, "Whiskyfun", r.whiskyfunScore || null);
  add(r.distillerLink, "Distiller", r.distillerScore ? String(r.distillerScore).split("—")[0].trim() : null);
  add(r.bronNotities, "Bron proefnotities", null);
  return links;
}

function descriptionBlock(r) {
  const desc = descriptionFor(r);
  if (!desc || !desc.text) return "";
  const long = desc.text.length > 320 || desc.text.split("\n").length > 6;
  const bron = desc.sourceUrl
    ? '<a class="bron" href="' + escapeAttr(desc.sourceUrl) + '" target="_blank" rel="noopener noreferrer">bron: Whiskysite.nl</a>'
    : '<span class="bron">bron: Whiskysite.nl</span>';
  return '<div class="block" id="omschrijving"><h3>Omschrijving</h3>'
    + '<div class="omschrijving' + (long ? " is-collapsed" : "") + '" id="omschrijving-text">' + escapeHtml(desc.text) + "</div>"
    + '<div class="omschrijving-meta">'
    + (long ? '<button type="button" class="lees-meer" id="leesMeer" aria-expanded="false">Lees meer</button>' : "")
    + bron
    + "</div></div>";
}

function factsHtml(pairs) {
  const html = pairs.map(([label, value]) => fact(label, value)).join("");
  return html ? '<div class="facts">' + html + "</div>" : "";
}

function renderTabs(tabs) {
  const visible = tabs.filter(t => t.html);
  if (!visible.length) return "";
  return '<div class="tabs" role="tablist">'
    + visible.map((t, i) =>
      '<button type="button" class="tab" role="tab" id="tabbtn-' + t.id + '" data-tab="' + t.id + '"'
      + ' aria-controls="tab-' + t.id + '" aria-selected="' + (i === 0 ? "true" : "false") + '"'
      + ' tabindex="' + (i === 0 ? "0" : "-1") + '">' + escapeHtml(t.label) + "</button>"
    ).join("")
    + "</div>"
    + visible.map((t, i) =>
      '<div class="tab-panel" role="tabpanel" id="tab-' + t.id + '" data-tab="' + t.id + '"'
      + ' aria-labelledby="tabbtn-' + t.id + '"' + (i === 0 ? "" : " hidden") + ">" + t.html + "</div>"
    ).join("");
}

function accordion(title, inner) {
  if (!inner) return "";
  return '<div class="accordion">'
    + '<button type="button" class="accordion-trigger" id="meerDetailsBtn" aria-expanded="false" aria-controls="meerDetails">'
    + escapeHtml(title)
    + '<svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>'
    + "</button>"
    + '<div class="accordion-panel" id="meerDetails" hidden>' + inner + "</div></div>";
}

function statCard(label, value, meta) {
  return '<div class="stat-card"><div class="stat-label">' + escapeHtml(label) + "</div>"
    + '<div class="stat-value">' + value + "</div>"
    + (meta ? '<div class="stat-meta">' + meta + "</div>" : "")
    + "</div>";
}

function renderDetailMissing() {
  document.title = "Niet gevonden · Whisky proefoverzicht";
  els.detail.innerHTML = '<div class="missing"><h2>Whisky niet gevonden</h2>'
    + '<p>Deze link wijst niet naar een botteling in het overzicht.</p></div>';
}

function parseHash() {
  const raw = (location.hash || "#").replace(/^#/, "");
  let path = raw;
  try { path = decodeURIComponent(raw); } catch {}
  path = path.replace(/^\/+/, "");
  if (!path || path === "/") return { view: "list" };
  let match = path.match(/^whisky\/([^/]+)$/);
  if (match) return { view: "detail", id: match[1] };
  match = path.match(/^vergelijk\/([^/]+)$/);
  if (match) {
    const ids = match[1].split(",").map(s => s.trim()).filter(Boolean).slice(0, COMPARE_MAX);
    return { view: "compare", ids };
  }
  if (path === "inzicht" || path.startsWith("inzicht/")) return { view: "inzicht" };
  return { view: "list" };
}

function rememberListScroll() {
  if (parseHash().view !== "list") return;
  listScroll = { table: els.tableWrap.scrollTop, window: window.scrollY };
}

function restoreListScroll() {
  if (!listScroll) return;
  const saved = listScroll;
  requestAnimationFrame(() => {
    els.tableWrap.scrollTop = saved.table;
    window.scrollTo(0, saved.window);
  });
}

function route() {
  hideHoverCard();
  const loc = parseHash();
  hideMainViews();
  if (loc.view === "detail") {
    const row = rowById(loc.id);
    document.body.classList.add("detail-mode");
    revealView(els.detailView);
    if (row) {
      renderDetail(row);
      const current = loc.id;
      if (!descriptionFor(row)) {
        loadDescriptions().then(() => {
          const now = parseHash();
          if (now.view === "detail" && now.id === current) renderDetail(row);
        });
      }
    } else {
      renderDetailMissing();
    }
    window.scrollTo(0, 0);
    return;
  }
  if (loc.view === "compare") {
    revealView(els.compareView);
    renderCompare(loc.ids);
    window.scrollTo(0, 0);
    return;
  }
  if (loc.view === "inzicht") {
    revealView(els.inzichtView);
    if (els.navInzicht) els.navInzicht.classList.add("is-active");
    renderInzicht();
    window.scrollTo(0, 0);
    return;
  }
  revealView(els.listView);
  document.title = "Whisky · Sample-overzicht";
  render(false);
  updateCompareBar();
  restoreListScroll();
}

function applyBounds(items) {
  const scores = items.map(r => r.score).filter(v => v != null);
  const prices = items.map(r => r.prijsSample).filter(v => v != null);
  const scoreMin = scores.length ? Math.floor(Math.min(...scores) * 10) / 10 : 60;
  const scoreMax = scores.length ? Math.ceil(Math.max(...scores) * 10) / 10 : 92;
  const prijsMin = prices.length ? Math.floor(Math.min(...prices)) : 1;
  const prijsMax = prices.length ? Math.ceil(Math.max(...prices)) : 100;
  state.defaults = { minScore: scoreMin, maxPrijs: prijsMax, scoreMin, scoreMax, prijsMin, prijsMax };
  state.minScore = scoreMin;
  state.maxPrijs = prijsMax;
  els.minScore.min = scoreMin;
  els.minScore.max = scoreMax;
  els.minScore.step = "0.1";
  els.minScore.value = scoreMin;
  els.maxPrijs.min = prijsMin;
  els.maxPrijs.max = prijsMax;
  els.maxPrijs.value = prijsMax;
  els.minScore.disabled = false;
  els.maxPrijs.disabled = false;
  els.inclOnbekend.checked = true;
  state.inclOnbekend = true;
}

function initPills() {
  makePills(document.getElementById("vat-pills"), uniqueInOrder(ROWS.flatMap(r => r.vatTags), VAT_ORDER), "vat");
  makePills(document.getElementById("rook-pills"), uniqueInOrder(ROWS.map(r => r.rook).filter(r => ROOK_ORDER.includes(r)), ROOK_ORDER), "rook");
  makePills(document.getElementById("regio-pills"), uniqueInOrder(ROWS.map(r => r.regioKort), REGIO_ORDER), "regio");
  makePills(document.getElementById("smaak-pills"), uniqueInOrder(ROWS.flatMap(r => r.flavour), FLAVOUR.map(f => f.label)), "smaak");
}

function setTasted(id, checked) {
  if (checked) state.tasted[id] = true;
  else delete state.tasted[id];
  saveTasted(state.tasted);
}

function resetFilters() {
  state.q = "";
  state.vat = new Set();
  state.rook = new Set();
  state.regio = new Set();
  state.smaak = new Set();
  state.minScore = state.defaults.minScore;
  state.maxPrijs = state.defaults.maxPrijs;
  state.inclOnbekend = true;
  state.sampleAvail = "alle";
  state.flesPrijsBekend = "alle";
  els.q.value = "";
  els.minScore.value = state.defaults.minScore;
  els.maxPrijs.value = state.defaults.maxPrijs;
  els.inclOnbekend.checked = true;
  document.querySelectorAll(".pill").forEach(p => p.setAttribute("aria-pressed", "false"));
  syncToggleGroups();
  render(true);
}

function rerenderOpenCharts() {
  const loc = parseHash();
  if (loc.view === "inzicht") {
    renderInzicht();
    return;
  }
  if (loc.view === "detail" && loc.id) {
    const tab = (els.detail.querySelector('.tab[aria-selected="true"]') || {}).dataset?.tab;
    const row = rowById(loc.id);
    if (!row) return;
    renderDetail(row);
    if (tab) activateTab(tab, { focus: false });
  }
}

function activateTab(tabId, opts) {
  const tabs = [...els.detail.querySelectorAll('.tab')];
  const panels = [...els.detail.querySelectorAll('.tab-panel')];
  if (!tabs.length) return;
  let target = tabs.find(t => t.dataset.tab === tabId) || tabs[0];
  tabs.forEach(t => {
    const on = t === target;
    t.setAttribute("aria-selected", on ? "true" : "false");
    t.tabIndex = on ? 0 : -1;
  });
  panels.forEach(p => { p.hidden = p.dataset.tab !== target.dataset.tab; });
  if (!opts || opts.focus !== false) target.focus();
}

function bindRowNavigate(container) {
  container.addEventListener("change", (e) => {
    const input = e.target.closest("input[data-id]");
    if (!input) return;
    setTasted(input.dataset.id, input.checked);
    render(false);
  });
  container.addEventListener("click", (e) => {
    if (e.target.closest("input, label.geproefd, .compare-toggle")) return;
    const nameLink = e.target.closest("a.name");
    if (nameLink) { rememberListScroll(); return; }
    const row = e.target.closest("[data-slug]");
    if (!row) return;
    rememberListScroll();
    location.hash = "#/whisky/" + row.dataset.slug;
  });
}

function syncToggleGroups() {
  document.querySelectorAll(".toggle-group").forEach(group => {
    const current = state[group.dataset.filter];
    group.querySelectorAll(".toggle-item").forEach(btn => {
      btn.setAttribute("aria-checked", btn.dataset.value === current ? "true" : "false");
    });
  });
}

function bindEvents() {
  applyTheme(currentTheme());
  applyView(currentView());
  if (els.themeBtn) els.themeBtn.addEventListener("click", cycleTheme);
  if (els.viewList) els.viewList.addEventListener("click", () => applyView("lijst"));
  if (els.viewGrid) els.viewGrid.addEventListener("click", () => applyView("grid"));
  els.q.addEventListener("input", () => { state.q = els.q.value.trim().toLowerCase(); render(true); });
  els.minScore.addEventListener("input", () => { state.minScore = Number(els.minScore.value); render(true); });
  els.maxPrijs.addEventListener("input", () => { state.maxPrijs = Number(els.maxPrijs.value); render(true); });
  els.inclOnbekend.addEventListener("change", () => { state.inclOnbekend = els.inclOnbekend.checked; render(true); });
  document.querySelectorAll(".toggle-group").forEach(group => {
    group.addEventListener("click", (e) => {
      const btn = e.target.closest(".toggle-item");
      if (!btn) return;
      const key = group.dataset.filter;
      state[key] = btn.dataset.value;
      syncToggleGroups();
      render(true);
    });
  });
  els.more.addEventListener("click", () => { state.shown += PAGE_SIZE; render(false); });
  els.tableWrap.addEventListener("scroll", rememberListScroll, { passive: true });
  window.addEventListener("scroll", rememberListScroll, { passive: true });

  document.querySelectorAll(".pills").forEach(group => {
    group.addEventListener("click", (e) => {
      const btn = e.target.closest(".pill");
      if (!btn) return;
      const key = btn.dataset.group;
      const value = btn.dataset.value;
      if (state[key].has(value)) state[key].delete(value);
      else state[key].add(value);
      group.querySelectorAll(".pill").forEach(p => p.setAttribute("aria-pressed", state[key].has(p.dataset.value) ? "true" : "false"));
      render(true);
    });
  });

  document.querySelectorAll("thead th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (state.sort === key) state.dir = state.dir === "asc" ? "desc" : "asc";
      else { state.sort = key; state.dir = key === "naam" ? "asc" : "desc"; }
      render(true);
    });
  });

  bindRowNavigate(els.rows);
  bindRowNavigate(els.cards);

  els.detailView.addEventListener("change", (e) => {
    const input = e.target.closest("input[data-id]");
    if (!input) return;
    setTasted(input.dataset.id, input.checked);
  });

  els.detailView.addEventListener("click", (e) => {
    const lees = e.target.closest("#leesMeer, .lees-meer");
    if (lees) {
      const text = document.getElementById("omschrijving-text");
      if (!text) return;
      const open = text.classList.toggle("is-collapsed") === false;
      lees.setAttribute("aria-expanded", open ? "true" : "false");
      lees.textContent = open ? "Toon minder" : "Lees meer";
      return;
    }
    const tab = e.target.closest(".tab");
    if (tab) {
      activateTab(tab.dataset.tab);
      return;
    }
    const acc = e.target.closest(".accordion-trigger");
    if (acc) {
      const panel = document.getElementById(acc.getAttribute("aria-controls"));
      if (!panel) return;
      const open = panel.hidden;
      panel.hidden = !open;
      acc.setAttribute("aria-expanded", open ? "true" : "false");
      acc.classList.toggle("is-open", open);
    }
  });

  els.detailView.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const tab = e.target.closest(".tab");
    if (!tab) return;
    const tabs = [...els.detail.querySelectorAll(".tab")];
    const i = tabs.indexOf(tab);
    if (i < 0) return;
    const next = e.key === "ArrowRight" ? (i + 1) % tabs.length : (i - 1 + tabs.length) % tabs.length;
    activateTab(tabs[next].dataset.tab);
    e.preventDefault();
  });

  document.querySelectorAll('a[href="#/"]').forEach(a => {
    a.addEventListener("click", () => {
      if (parseHash().view !== "list") return;
      rememberListScroll();
    });
  });

  document.addEventListener("click", (e) => {
    const toggle = e.target.closest(".compare-toggle");
    if (toggle) {
      e.preventDefault();
      e.stopPropagation();
      toggleCompare(toggle.dataset.compareId);
      const loc = parseHash();
      if (loc.view === "list") render(false);
      else if (loc.view === "detail") {
        const row = rowById(loc.id);
        if (row) renderDetail(row);
      } else if (loc.view === "compare") renderCompare(loc.ids);
      return;
    }
    const remove = e.target.closest("[data-compare-remove]");
    if (remove) {
      toggleCompare(remove.dataset.compareRemove);
      const loc = parseHash();
      if (loc.view === "list") render(false);
      else if (loc.view === "compare") renderCompare(loc.ids);
      else if (loc.view === "detail") {
        const row = rowById(loc.id);
        if (row) renderDetail(row);
      }
    }
  });
  els.compareGo.addEventListener("click", () => {
    if (state.compare.length >= 2) location.hash = compareHref();
  });
  els.compareClear.addEventListener("click", () => {
    state.compare = [];
    saveCompare(state.compare);
    updateCompareBar();
    const loc = parseHash();
    if (loc.view === "list") render(false);
    else if (loc.view === "detail") {
      const row = rowById(loc.id);
      if (row) renderDetail(row);
    }
  });

  els.inzicht.addEventListener("click", (e) => {
    const point = e.target.closest("[data-slug]");
    if (!point) return;
    location.hash = "#/whisky/" + point.dataset.slug;
  });
  els.inzicht.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const point = e.target.closest(".scatter-point[data-slug]");
    if (!point) return;
    e.preventDefault();
    location.hash = "#/whisky/" + point.dataset.slug;
  });

  function scatterTooltipHtml(r) {
    return '<div class="tt-name">' + escapeHtml(displayName(r.naam)) + "</div>"
      + '<div class="tt-meta">' + escapeHtml(scoreFmt.format(r.score) + " · " + euro.format(r.prijsSample)) + "</div>";
  }
  function placeChartTooltip(ev) {
    const wrap = els.inzicht.querySelector(".scatter-wrap");
    const tip = document.getElementById("chartTooltip");
    if (!wrap || !tip || tip.hidden) return;
    const rect = wrap.getBoundingClientRect();
    let x = ev.clientX - rect.left;
    let y = ev.clientY - rect.top;
    const pad = 8;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
    const trect = tip.getBoundingClientRect();
    if (trect.left < rect.left + pad) x += (rect.left + pad) - trect.left;
    if (trect.right > rect.right - pad) x -= trect.right - (rect.right - pad);
    if (trect.top < rect.top + pad) y += trect.height + 20;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  els.inzicht.addEventListener("pointerover", (e) => {
    const point = e.target.closest(".scatter-point[data-slug]");
    const tip = document.getElementById("chartTooltip");
    if (!point || !tip) return;
    const r = rowById(point.dataset.slug);
    if (!r) return;
    tip.innerHTML = scatterTooltipHtml(r);
    tip.hidden = false;
    placeChartTooltip(e);
  });
  els.inzicht.addEventListener("pointermove", placeChartTooltip);
  els.inzicht.addEventListener("pointerout", (e) => {
    const next = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".scatter-point");
    if (next) return;
    const tip = document.getElementById("chartTooltip");
    if (tip) tip.hidden = true;
  });

  const schemeMq = window.matchMedia("(prefers-color-scheme: dark)");
  const onSchemeChange = () => {
    if (currentTheme() === "system") applyTheme("system", { rerender: true });
  };
  if (schemeMq.addEventListener) schemeMq.addEventListener("change", onSchemeChange);
  else if (schemeMq.addListener) schemeMq.addListener(onSchemeChange);

  let hoverTimer = 0;
  els.rows.addEventListener("pointerenter", (e) => {
    if (!canHoverPreview()) return;
    const link = e.target.closest("a.name[data-hover-id]");
    if (!link) return;
    const r = rowById(link.dataset.hoverId);
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => showHoverCard(r, link), 120);
  }, true);
  els.rows.addEventListener("pointerleave", (e) => {
    const link = e.target.closest("a.name[data-hover-id]");
    if (!link) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(hideHoverCard, 120);
  }, true);
  window.addEventListener("scroll", hideHoverCard, { passive: true });

  document.querySelectorAll(".js-reset").forEach(btn => btn.addEventListener("click", resetFilters));

  els.filterBtn.addEventListener("click", () => { filtersOpen() ? closeFilters() : openFilters(); });
  els.sheetClose.addEventListener("click", closeFilters);
  els.sheetApply.addEventListener("click", closeFilters);
  els.sheetBackdrop.addEventListener("click", closeFilters);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && filtersOpen()) closeFilters();
    if (e.key === "Escape") hideHoverCard();
  });
  window.matchMedia("(min-width: 1024px)").addEventListener("change", (mq) => {
    if (mq.matches) closeFilters();
  });

  window.addEventListener("hashchange", route);
}

async function runSmoke() {
  const report = { errors: jsErrors.slice(), total: ROWS.length };
  report.initialHash = location.hash;
  report.startOnDetail = !els.detailView.hidden;
  if (report.startOnDetail) {
    report.deepLinkName = (els.detail.querySelector("h2") || {}).textContent || "";
    report.deepLinkHasLinks = !!els.detail.querySelector("#links .ext-link, #links .unknown");
    report.deepLinkExternal = [...els.detail.querySelectorAll("a[href^='http']")].map(a => ({
      href: a.getAttribute("href"), target: a.getAttribute("target")
    }));
    report.deepLinkAllNewTab = report.deepLinkExternal.every(a => a.target === "_blank");
    location.hash = "#/";
    route();
  }

  report.initialCountText = els.count.textContent;
  report.initialRows = els.rows.querySelectorAll("tr").length;
  report.moreVisible = !els.moreWrap.hidden;
  const scored = ROWS.filter(r => r.score != null).length;
  els.inclOnbekend.checked = false;
  state.inclOnbekend = false;
  render(true);
  report.withoutUnknown = ROWS.filter(matches).length;
  report.scoredTotal = scored;
  els.inclOnbekend.checked = true;
  state.inclOnbekend = true;
  render(true);

  report.noSampleCount = ROWS.filter(r => r.prijsSample == null).length;
  report.atMaxPrice = ROWS.filter(matches).length;
  state.maxPrijs = state.defaults.maxPrijs - 1;
  els.maxPrijs.value = state.maxPrijs;
  render(true);
  const after = ROWS.filter(matches);
  report.afterPriceFilter = after.length;
  report.afterPriceFilterHasNoSample = after.some(r => r.prijsSample == null);
  report.afterPriceFilterOverMax = after.some(r => r.prijsSample > state.maxPrijs);
  report.afterPriceFilterExpected = ROWS.filter(r => r.prijsSample != null && r.prijsSample <= state.maxPrijs && (r.score == null ? state.inclOnbekend : r.score >= state.minScore)).length;
  document.getElementById("reset").click();

  const rookBtn = document.querySelector('.pill[data-group="rook"][data-value="geen"]');
  if (rookBtn) rookBtn.click();
  report.afterRookGeen = ROWS.filter(matches).length;
  document.getElementById("reset").click();
  els.q.value = "glenfarclas";
  state.q = "glenfarclas";
  render(true);
  report.afterSearchGlenfarclas = ROWS.filter(matches).length;
  report.filtersBeforeDetail = state.q;
  const firstLink = els.rows.querySelector("a.name");
  report.listNameHref = firstLink ? firstLink.getAttribute("href") : null;
  report.listExternalLinks = [...els.listView.querySelectorAll("a")].map(a => a.getAttribute("href")).filter(h => /^https?:/i.test(h || ""));
  rememberListScroll();
  const targetId = (ROWS.find(r => r.id === "glengoyne-30-years-old") || ROWS[0]).id;
  location.hash = "#/whisky/" + targetId;
  route();
  report.detailVisible = !els.detailView.hidden && els.listView.hidden;
  report.detailName = (els.detail.querySelector("h2") || {}).textContent || "";
  report.detailHasLinksSection = !!els.detail.querySelector("#links");
  report.detailExternal = [...els.detail.querySelectorAll("a[href^='http']")].map(a => a.getAttribute("target"));
  report.detailExternalAllNewTab = report.detailExternal.length > 0 && report.detailExternal.every(t => t === "_blank");
  location.hash = "#/";
  route();
  report.listVisibleAfterBack = !els.listView.hidden && els.detailView.hidden;
  report.filtersAfterBack = state.q;
  document.getElementById("reset").click();
  location.hash = "#/whisky/bestaat-niet";
  route();
  report.missingShown = /niet gevonden/i.test(els.detailView.innerText);
  location.hash = "#/";
  route();
  report.previewNotePresent = /Voorbeeld met een selectie/i.test(document.body.innerText);
  report.hasPersonalCol = /Past bij smaak/i.test(document.body.innerText);
  report.errors = jsErrors.slice();
  const flag = document.createElement("pre");
  flag.id = "smoke-report";
  flag.textContent = JSON.stringify(report);
  document.body.appendChild(flag);
  window.__SMOKE__ = report;
}

bindEvents();

fetch("data.json")
  .then(res => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then(payload => {
    const items = Array.isArray(payload) ? payload : (payload.items || []);
    ROWS = items.map(enrich);
    applyBounds(ROWS);
    initPills();
    if (els.listSkeleton) els.listSkeleton.hidden = true;
    els.status.hidden = true;
    state.compare = loadCompare().filter(id => items.some(r => r.id === id));
    saveCompare(state.compare);
    updateCompareBar();
    loadDescriptions();
    route();
    if (new URLSearchParams(location.search).has("smoke")) return runSmoke();
  })
  .catch(err => {
    if (els.listSkeleton) els.listSkeleton.hidden = true;
    els.status.hidden = false;
    els.status.classList.add("error");
    els.status.textContent = "De gegevens konden niet worden geladen. Controleer of data.json naast deze pagina staat.";
    jsErrors.push(String(err));
  });
</script>
</body>
</html>
