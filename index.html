<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisky · Sample-overzicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f6;
    --paper: #ffffff;
    --ink: #122033;
    --muted: #5c6b7c;
    --line: #e6ebf1;
    --line-strong: #d5dce5;
    --accent: #0f766e;
    --accent-2: #0d9488;
    --accent-soft: #ccfbf1;
    --navy: #0b1220;
    --navy-2: #152238;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 10px 28px rgba(15, 23, 42, 0.06);
    --header-h: 58px;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100%;
  }
  body {
    background-image:
      radial-gradient(ellipse 80% 50% at 100% -10%, rgba(13, 148, 136, 0.08), transparent 50%),
      radial-gradient(ellipse 60% 40% at 0% 0%, rgba(14, 116, 144, 0.06), transparent 45%);
  }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--navy); }

  .site-header {
    background: var(--navy);
    color: #f4f7fb;
    padding: 0 28px;
    height: var(--header-h);
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 0;
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: 0 1px 0 rgba(255,255,255,0.06);
  }
  .logo {
    width: 36px; height: 36px; flex: 0 0 36px;
    display: grid; place-items: center;
    border-radius: 10px;
  }
  .logo svg { width: 36px; height: 36px; display: block; }
  .brand { flex: 1; min-width: 0; }
  .brand h1 {
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .brand h1 em { font-style: normal; font-weight: 600; color: #5eead4; }
  .brand-link { color: inherit; text-decoration: none; display: block; }
  .brand-link:hover { color: inherit; }
  .brand-link:hover h1 em { color: #99f6e4; }

  #listView {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 24px 56px;
  }

  .filters {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px 12px;
    position: sticky;
    top: calc(var(--header-h) + 10px);
    z-index: 25;
  }
  .filter-top {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 12px 20px;
    align-items: end;
    margin-bottom: 10px;
  }
  .field label, .pills-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .search {
    width: 100%;
    border: 1px solid var(--line-strong);
    background: #f8fafc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%235c6b7c' stroke-width='2' stroke-linecap='round'><circle cx='7' cy='7' r='5'/><path d='M11 11l3.5 3.5'/></svg>") 10px 50% no-repeat;
    border-radius: 10px;
    padding: 8px 12px 8px 34px;
    font: inherit;
    color: var(--ink);
  }
  .search:focus { outline: 2px solid rgba(13, 148, 136, 0.35); border-color: var(--accent-2); background-color: #fff; }
  .slider-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
  .slider-val { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; color: var(--ink); flex: 0 0 auto; white-space: nowrap; }
  input[type="range"] { width: 100%; accent-color: var(--accent); height: 20px; }

  .filter-row { display: flex; align-items: center; gap: 10px; margin-top: 7px; }
  .pills-label.side { flex: 0 0 72px; margin: 0; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .pill {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: #f8fafc;
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    line-height: 1.35;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .pill:hover { border-color: var(--accent-2); background: #fff; }
  .pill[aria-pressed="true"] {
    background: var(--navy);
    color: #f4f7fb;
    border-color: var(--navy);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .count { font-size: 13px; color: var(--muted); min-width: 0; flex: 1; overflow-wrap: anywhere; }
  .count strong { color: var(--ink); font-weight: 700; }
  .reset {
    margin-left: auto;
    appearance: none; border: 0; background: none;
    color: var(--accent);
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    min-height: 32px;
  }
  .reset:hover { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; }

  .table-wrap {
    margin-top: 14px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: auto;
  }
  table { width: 100%; border-collapse: collapse; min-width: 1040px; }
  thead th {
    position: sticky; top: 0; z-index: 5;
    background: #f7f9fb;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted);
    padding: 11px 14px;
    white-space: nowrap;
    user-select: none;
  }
  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: var(--ink); }
  thead th .arrow { display: inline-block; margin-left: 4px; font-size: 10px; opacity: 0.35; }
  thead th[aria-sort="ascending"] .arrow,
  thead th[aria-sort="descending"] .arrow { opacity: 1; color: var(--accent); }

  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; transition: background 0.12s ease; }
  tbody tr:hover td { background: #f5fbfa; }
  tbody tr.tasted td { background: #f0fdfa; }
  tbody tr.tasted td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tbody tr .col-check, tbody tr .geproefd { cursor: default; }

  .col-check { width: 52px; text-align: center; }
  thead th.col-check { text-align: center; }
  .col-inhoud, .col-prijs, .col-score { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .col-prijs, .col-fles { text-align: right; }
  thead th.col-prijs, thead th.col-fles { text-align: right; }

  .name {
    font-weight: 650; color: var(--ink); text-decoration: none;
    display: inline-block; letter-spacing: -0.015em;
    overflow-wrap: anywhere; word-break: break-word;
  }
  .name:hover { color: var(--accent); text-decoration: none; }
  .sub { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag {
    font-size: 10.5px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
    background: #eef6f6; color: #115e59;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }

  .price { font-weight: 700; font-variant-numeric: tabular-nums; }
  .votes { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }

  .score-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 3.4rem;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13.5px;
    font-variant-numeric: tabular-nums lining-nums;
    letter-spacing: -0.02em;
    line-height: 1.3;
  }
  .score-badge.large {
    min-width: 4.75rem;
    padding: 10px 16px;
    font-size: 28px;
    border-radius: 14px;
  }
  .score-badge.top { background: #0f766e; color: #fff; }
  .score-badge.high { background: #1d4ed8; color: #fff; }
  .score-badge.mid { background: #4338ca; color: #fff; }
  .score-badge.low { background: #e2e8f0; color: #334155; }
  .score-badge.unknown {
    background: #fff; color: #64748b;
    border: 1px solid #cbd5e1; min-width: 0;
  }

  .vat { display: block; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .rook {
    display: inline-block; margin-top: 4px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 6px;
    background: #eef2f6; color: var(--muted);
  }
  .rook.geen { background: #d1fae5; color: #065f46; }
  .rook.licht { background: #e0f2fe; color: #075985; }
  .rook.medium { background: #e0e7ff; color: #3730a3; }
  .rook.zwaar { background: #0f172a; color: #e2e8f0; }

  .shop { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; text-decoration: none; }
  .empty { color: #94a3b8; }

  .geproefd { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
  .geproefd input {
    appearance: none; width: 16px; height: 16px;
    border: 1.5px solid var(--line-strong); border-radius: 5px;
    background: #fff; display: grid; place-items: center; cursor: pointer; margin: 0;
  }
  .geproefd input:checked { background: var(--accent); border-color: var(--accent); }
  .geproefd input:checked::after {
    content: ""; width: 8px; height: 5px;
    border: 2px solid #fff; border-top: 0; border-right: 0;
    transform: rotate(-45deg) translate(0, -1px);
  }
  .geproefd input:focus-visible { outline: 2px solid rgba(13, 148, 136, 0.5); outline-offset: 2px; }

  .empty-state { text-align: center; padding: 48px 16px; color: var(--muted); }

  .check-opt {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px; font-size: 12.5px; color: var(--muted);
    cursor: pointer; user-select: none; width: fit-content;
  }
  .check-opt input { accent-color: var(--accent); }
  .wb-status {
    display: block; font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.3;
  }
  .wb-status.open { color: #0e7490; font-weight: 600; }
  .stock-no { color: #0e7490; }
  .more-wrap { text-align: center; padding: 14px 0 16px; }
  .more {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    font: inherit; font-weight: 600; font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 10px;
    cursor: pointer;
    min-height: 44px;
  }
  .more:hover { border-color: var(--accent); color: var(--accent); }
  .status-msg {
    max-width: 1180px;
    margin: 24px auto;
    padding: 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .status-msg.error { color: #b42318; }
  .crit { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .detail-view {
    max-width: 880px;
    margin: 0 auto;
    padding: 16px 24px 72px;
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 4px 2px;
    font-weight: 600; font-size: 14px;
    color: var(--accent); text-decoration: none;
  }
  .back:hover { color: var(--navy); }
  .detail {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 28px 32px;
  }
  .detail-head {
    display: flex; align-items: flex-start; gap: 20px;
    justify-content: space-between;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .detail-head > div { min-width: 0; flex: 1; }
  .detail-head h2 {
    font-weight: 700;
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: -0.03em;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .detail-aside {
    display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
    flex: 0 0 auto;
  }
  .taste-check {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600;
    min-height: 44px;
    cursor: pointer; user-select: none;
  }
  .taste-check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .detail .tags { margin-top: 12px; }
  .detail .tag { font-size: 12px; padding: 3px 10px; background: #e6f7f4; color: #115e59; }

  .facts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0 28px;
    margin-top: 8px;
  }
  .fact {
    display: grid;
    grid-template-columns: minmax(110px, 38%) 1fr;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    align-items: start;
  }
  .fact dt {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted); padding-top: 2px;
  }
  .fact dd { font-size: 15px; overflow-wrap: anywhere; }
  .fact .empty, .unknown { color: #94a3b8; }

  .block { margin-top: 28px; }
  .block h3 {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .notes { font-size: 16px; line-height: 1.65; white-space: pre-wrap; }
  .notes-source { display: block; margin-top: 8px; font-size: 12.5px; color: var(--muted); }

  .link-list { display: flex; flex-direction: column; gap: 8px; }
  .ext-link {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    min-height: 48px;
    padding: 10px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    background: #f8fafc;
    text-decoration: none;
    color: var(--ink);
    font-weight: 650;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .ext-link:hover { border-color: var(--accent); color: var(--accent); background: #fff; }
  .ext-link span { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }

  .missing { padding: 28px 8px 12px; }
  .missing h2 { font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }

  @media (max-width: 960px) {
    .filter-top { grid-template-columns: 1fr; }
    .site-header { padding-left: 16px; padding-right: 16px; }
    #listView, .detail-view, .status-msg { padding-left: 16px; padding-right: 16px; }
    .pills-label.side { flex: 0 0 56px; }
    .facts { grid-template-columns: 1fr; gap: 0; }
  }

  @media (max-width: 720px) {
    :root { --header-h: 52px; }
    .brand h1 { font-size: 17px; }
    .site-header { padding: 0 14px; }
    #listView { padding: 0 0 48px; }
    .filters {
      top: var(--header-h);
      border-radius: 0;
      border-left: 0; border-right: 0;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      padding: 8px 14px 8px;
    }
    .filter-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      margin-bottom: 6px;
    }
    .filter-top .field:first-child { grid-column: 1 / -1; }
    .field { min-width: 0; }
    .search { padding-top: 7px; padding-bottom: 7px; }
    .filter-row {
      margin-top: 6px;
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .pills-label.side { flex: 0 0 auto; margin-right: 4px; }
    .pills { flex-wrap: nowrap; min-width: 0; }
    .pill { white-space: nowrap; padding: 6px 10px; }
    .toolbar { margin-top: 6px; padding-top: 6px; }
    .table-wrap {
      overflow: visible;
      background: transparent;
      border: 0;
      box-shadow: none;
      margin: 10px 14px 0;
      border-radius: 0;
    }
    table { min-width: 0; width: 100%; border-collapse: separate; border-spacing: 0 8px; }
    thead { display: none; }
    tbody tr {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      grid-template-areas:
        "check name score"
        "check vat vat"
        "check inhoud inhoud"
        "check prijs prijs"
        "check fles fles";
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 6px 16px rgba(15, 23, 42, 0.04);
      padding: 10px 10px 12px;
      align-items: start;
    }
    tbody td { border-bottom: 0; padding: 2px 6px; background: transparent !important; }
    tbody tr:hover td { background: transparent; }
    tbody tr.tasted { box-shadow: inset 3px 0 0 var(--accent), 0 1px 2px rgba(15, 23, 42, 0.04); }
    tbody tr.tasted td:first-child { box-shadow: none; }
    .col-check { grid-area: check; padding-top: 8px; width: auto; }
    td:nth-child(2) { grid-area: name; min-width: 0; }
    .name { display: block; max-width: 100%; }
    .col-score {
      grid-area: score;
      text-align: right;
      justify-self: end;
      white-space: normal;
    }
    .score-badge { white-space: nowrap; }
    td:nth-child(6) { grid-area: vat; min-width: 0; }
    .col-inhoud, .col-prijs, .col-fles {
      text-align: left;
      padding: 0 6px;
      font-size: 13px;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .col-inhoud { grid-area: inhoud; margin-top: 6px; }
    .col-prijs { grid-area: prijs; }
    .col-fles { grid-area: fles; }
    .vat { max-width: none; white-space: normal; overflow: visible; overflow-wrap: anywhere; }
    .shop { display: inline; margin-left: 4px; overflow-wrap: anywhere; }
    .detail-view { padding: 8px 14px 64px; }
    .detail { padding: 18px 16px 22px; overflow: hidden; }
    .detail-head { flex-direction: column; gap: 12px; }
    .detail-head h2 { font-size: 22px; }
    .detail-aside { align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 12px; max-width: 100%; }
    .score-badge.large { font-size: 22px; padding: 8px 12px; }
    .fact { grid-template-columns: 1fr; gap: 2px; }
    .fact dd { min-width: 0; }
  }
</style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#/" aria-label="Terug naar het overzicht">
      <svg viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <rect width="36" height="36" rx="10" fill="#14b8a6"/>
        <path d="M13 8h10l-1 9.5c-.3 2.4.7 4.2 2.3 5.4 1.2.9 1.9 2.2 1.9 3.6v.3c0 1.7-2.8 3.2-8.2 3.2S9.8 28.5 9.8 26.8v-.3c0-1.4.7-2.7 1.9-3.6 1.6-1.2 2.6-3 2.3-5.4L13 8z" stroke="#fff" stroke-width="1.7" fill="rgba(255,255,255,0.14)"/>
        <path d="M14.2 12.5h7.6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </a>
    <div class="brand">
      <a class="brand-link" href="#/">
        <h1>Whisky <em>proefoverzicht</em></h1>
      </a>
    </div>
  </header>

  <div class="status-msg" id="status">Gegevens worden geladen…</div>

  <div id="listView" hidden>
    <section class="filters" aria-label="Filters">
      <div class="filter-top">
        <div class="field">
          <label for="q">Zoeken</label>
          <input id="q" class="search" type="search" placeholder="Naam, vat, regio, winkel…" autocomplete="off">
        </div>
        <div class="field">
          <div class="slider-top">
            <label for="minScore">Min. score</label>
            <span class="slider-val" id="minScoreVal">—</span>
          </div>
          <input id="minScore" type="range" min="60" max="92" step="0.1" value="60" disabled>
          <label class="check-opt">
            <input id="inclOnbekend" type="checkbox" checked>
            Ook zonder score
          </label>
        </div>
        <div class="field">
          <div class="slider-top">
            <label for="maxPrijs">Max. sampleprijs</label>
            <span class="slider-val" id="maxPrijsVal">—</span>
          </div>
          <input id="maxPrijs" type="range" min="1" max="100" step="1" value="100" disabled>
        </div>
      </div>

      <div class="filter-row">
        <span class="pills-label side" id="vat-label">Vattype</span>
        <div class="pills" id="vat-pills" role="group" aria-labelledby="vat-label"></div>
      </div>
      <div class="filter-row">
        <span class="pills-label side" id="rook-label">Rook</span>
        <div class="pills" id="rook-pills" role="group" aria-labelledby="rook-label"></div>
      </div>
      <div class="filter-row">
        <span class="pills-label side" id="regio-label">Regio</span>
        <div class="pills" id="regio-pills" role="group" aria-labelledby="regio-label"></div>
      </div>
      <div class="filter-row">
        <span class="pills-label side" id="smaak-label">Smaak</span>
        <div class="pills" id="smaak-pills" role="group" aria-labelledby="smaak-label"></div>
      </div>

      <div class="toolbar">
        <div class="count" id="count"></div>
        <button type="button" class="reset" id="reset">Wis filters</button>
      </div>
    </section>

    <div class="table-wrap" id="tableWrap">
      <table>
        <thead>
          <tr>
            <th class="col-check" scope="col">Geproefd</th>
            <th class="sortable" data-sort="naam" scope="col" aria-sort="none">Naam <span class="arrow">↕</span></th>
            <th class="sortable col-inhoud" data-sort="inhoud" scope="col" aria-sort="none">Inhoud <span class="arrow">↕</span></th>
            <th class="sortable col-prijs" data-sort="prijsSample" scope="col" aria-sort="none">Sample <span class="arrow">↕</span></th>
            <th class="sortable col-score" data-sort="score" scope="col" aria-sort="descending">Score <span class="arrow">↓</span></th>
            <th class="sortable" data-sort="rook" scope="col" aria-sort="none">Vat / rook <span class="arrow">↕</span></th>
            <th class="sortable col-fles" data-sort="flesPrijs" scope="col" aria-sort="none">Fles in NL <span class="arrow">↕</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty-state" id="empty" hidden>Geen flessen die aan de filters voldoen.</div>
      <div class="more-wrap" id="moreWrap" hidden>
        <button type="button" class="more" id="more">Toon meer</button>
      </div>
    </div>
  </div>

  <div class="detail-view" id="detailView" hidden>
    <a class="back" id="backLink" href="#/">← Overzicht</a>
    <article class="detail" id="detail"></article>
  </div>

  <noscript>Deze pagina heeft JavaScript nodig om het overzicht te tonen.</noscript>

<script>
const VAT_ORDER = ["Oloroso","PX","Sherry","Bourbon","Wijn","Port","Rum","Cognac/Armagnac","Virgin oak","Gemengd"];
const ROOK_ORDER = ["geen","licht","medium","zwaar"];
const REGIO_ORDER = ["Speyside","Highland","Islay","Lowland","Campbeltown","Orkney","Arran","Mull","Islands","Ierland","Taiwan","Japan","Kentucky","Canada","Nederland","Denemarken","België"];
const FLAVOUR = [
  { id: "fruitig", label: "Fruitig", re: /fruit|appel|\bpeer\b|perzik|pruim|kers|\bbes\b|bessen|braam|sinaasappel|citrus|citroen|sinaas|abrikoos|herfstfruit|\borange\b|berry|cherry|\bplum\b|\bapple\b|peach|lemon sherbet|citruszeste|citrusschil|gestoofd fruit/i },
  { id: "zoet", label: "Zoet", re: /zoet|toffee|karamel|caramel|fudge|marshmallow|siroop|syrup|sherbet|honingraat|kerstcake|toffee-app|snoepzoet/i },
  { id: "sherryfruit", label: "Sherry / gedroogd fruit", re: /sherry|rozijn|vijg|vijgen|\bdadel|\bdadels|sultana|krent|gedroogd fruit|raisin|kerstcake|rum-rozijn/i },
  { id: "kruidig", label: "Kruidig", re: /kruid|kaneel|nootmuskaat|gember|peper|kruidnagel|gingerbread|nutmeg|cinnamon|clove|\bpepper\b|glühwein|kaneelpap/i },
  { id: "vanille", label: "Vanille / honing", re: /vanille|vanilla|honing|\bhoney\b|honingraat|honingvanille/i },
  { id: "tropisch", label: "Tropisch", re: /tropisch|ananas|mango|kokos|coconut|pineapple|banaan|banana|papaya|guave|passievrucht/i },
  { id: "chocolade", label: "Chocolade / koffie", re: /chocolade|chocolate|mokka|mocha|koffie|coffee|cacao|cocoa|espresso/i },
  { id: "turfrook", label: "Turf / rook", re: /geturfd|turf|rokerig|gerookt|\bpeat\b|\bsmoky\b|\bsmoke\b|fenol/i },
  { id: "maritiem", label: "Maritiem", re: /zilt|zeezout|\bzout\b|\bzee\b|maritime|\bsea\b|iodine|jodium|zeewier|kelp|brine|zilte/i }
];
const PAGE_SIZE = 80;
const STORAGE_KEY = "whisky-tool-geproefd";
const rookOrder = { geen: 0, licht: 1, medium: 2, zwaar: 3, onbekend: 4 };

function parseRegio(regio) {
  if (!regio) return null;
  const head = regio.split(/[,—]/)[0].trim().toLowerCase();
  if (/^onbekend\b/.test(head)) return null;
  const map = [
    ["isle of mull","Mull"],["campbeltown","Campbeltown"],["speyside","Speyside"],
    ["islay","Islay"],["orkney","Orkney"],["highland","Highland"],
    ["ierland","Ierland"],["lowland","Lowland"],["taiwan","Taiwan"],["japan","Japan"],
    ["isle of arran","Arran"],["arran","Arran"],["islands","Islands"],
    ["kentucky","Kentucky"],["canada","Canada"],["nederland","Nederland"],
    ["denemarken","Denemarken"],["belgië","België"],["belgie","België"],
    ["bourbon","Kentucky"],["mull","Mull"]
  ];
  for (const [k,v] of map) if (head.includes(k)) return v;
  return null;
}

function deriveVat(vattype) {
  if (!vattype) return [];
  let t = vattype.toLowerCase();
  t = t.replace(/niet[\s-]*sherry\w*/g, " ");
  if (/^onbekend( vattype)?\b/.test(t) && !/(oloroso|sherry|bourbon|\bpx\b|port)/.test(t)) return [];
  const tags = [];
  if (/oloroso/.test(t)) tags.push("Oloroso");
  if (/pedro xim[eé]nez|ximenez|\bpx\b|px-/.test(t)) tags.push("PX");
  if (/bourbon/.test(t)) tags.push("Bourbon");
  if (/\bport\b|tawny|colheita|ruby port/.test(t)) tags.push("Port");
  if (/\brum\b/.test(t)) tags.push("Rum");
  if (/rode wijn|red wine|witte wijn|white wine|barolo|burgundy|bordeaux|sauternes|madeira|marsala|tokaji|pineau|rioja|syrah/.test(t)) tags.push("Wijn");
  if (/cognac|armagnac/.test(t)) tags.push("Cognac/Armagnac");
  if (/virgin oak|nieuw eiken/.test(t)) tags.push("Virgin oak");
  if (/sherry/.test(t) && !tags.includes("Oloroso") && !tags.includes("PX")) tags.push("Sherry");
  if (tags.length >= 2) tags.push("Gemengd");
  return tags;
}

function flavourTags(r) {
  const notes = unknownToEmpty(r.proefnotities);
  const vat = (r.vattype || "").replace(/niet[\s-]*sherry\w*/gi, " ");
  const regio = (r.regio || "").replace(/ongeturfd\w*/gi, " ");
  const text = [notes, vat, regio].join(" ");
  const peatText = [notes, vat, regio].join(" ").replace(/ongeturfd\w*/gi, " ");
  const tags = [];
  for (const f of FLAVOUR) {
    if (f.id === "turfrook") {
      if (["licht","medium","zwaar"].includes(r.rook) || f.re.test(peatText)) tags.push(f.label);
      continue;
    }
    if (f.id === "sherryfruit") {
      const vatTags = deriveVat(r.vattype);
      if (vatTags.includes("Oloroso") || vatTags.includes("PX") || vatTags.includes("Sherry") || f.re.test(notes) || f.re.test(vat)) {
        tags.push(f.label);
      }
      continue;
    }
    if (f.re.test(text)) tags.push(f.label);
  }
  return tags;
}

function unknownToEmpty(value) {
  if (value == null) return "";
  const text = String(value).trim();
  if (!text || /^onbekend\b/i.test(text)) return "";
  return text;
}

function enrich(r) {
  return {
    ...r,
    vatTags: deriveVat(r.vattype),
    flavour: flavourTags(r),
    regioKort: parseRegio(r.regio)
  };
}

const euro = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
const num = new Intl.NumberFormat("nl-NL", { minimumFractionDigits: 1, maximumFractionDigits: 2 });
const scoreFmt = new Intl.NumberFormat("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const intFmt = new Intl.NumberFormat("nl-NL");

function displayName(naam) {
  return naam
    .replace(/\s+\d+\s*CL\s+Sample\s*$/i, "")
    .replace(/\s+\d+(?:[.,]\d+)?%\s*$/, "")
    .trim();
}
function rowId(r) { return r.naam + "|" + (r.inhoud || "fles"); }
function detailHref(r) { return "#/whisky/" + encodeURIComponent(r.id); }
function loadTasted() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { return {}; }
}
function saveTasted(map) { localStorage.setItem(STORAGE_KEY, JSON.stringify(map)); }

const state = {
  q: "",
  vat: new Set(),
  rook: new Set(),
  regio: new Set(),
  smaak: new Set(),
  minScore: 60,
  maxPrijs: 100,
  inclOnbekend: true,
  sort: "score",
  dir: "desc",
  shown: PAGE_SIZE,
  tasted: loadTasted(),
  defaults: { minScore: 60, maxPrijs: 100, scoreMin: 60, scoreMax: 92, prijsMin: 1, prijsMax: 100 }
};

let ROWS = [];
let listScroll = null;
const jsErrors = [];
window.addEventListener("error", (e) => { jsErrors.push(String(e.message || e)); });
window.addEventListener("unhandledrejection", (e) => { jsErrors.push(String(e.reason || e)); });

const els = {
  q: document.getElementById("q"),
  minScore: document.getElementById("minScore"),
  maxPrijs: document.getElementById("maxPrijs"),
  minScoreVal: document.getElementById("minScoreVal"),
  maxPrijsVal: document.getElementById("maxPrijsVal"),
  inclOnbekend: document.getElementById("inclOnbekend"),
  rows: document.getElementById("rows"),
  empty: document.getElementById("empty"),
  count: document.getElementById("count"),
  reset: document.getElementById("reset"),
  status: document.getElementById("status"),
  tableWrap: document.getElementById("tableWrap"),
  more: document.getElementById("more"),
  moreWrap: document.getElementById("moreWrap"),
  listView: document.getElementById("listView"),
  detailView: document.getElementById("detailView"),
  detail: document.getElementById("detail")
};

function uniqueInOrder(items, order) {
  const set = new Set(items.filter(Boolean));
  return order.filter(x => set.has(x)).concat([...set].filter(x => !order.includes(x)));
}

function makePills(container, values, group) {
  container.innerHTML = values.map(v =>
    '<button type="button" class="pill" data-group="' + group + '" data-value="' + escapeAttr(v) + '" aria-pressed="false">' + escapeHtml(labelFor(group, v)) + '</button>'
  ).join("");
}
function labelFor(group, v) {
  if (group === "rook") return v.charAt(0).toUpperCase() + v.slice(1);
  return v;
}

function vatMatch(rowTags, selected) {
  if (selected.size === 0) return true;
  return rowTags.some(t => {
    if (selected.has(t)) return true;
    if (selected.has("Sherry") && (t === "Oloroso" || t === "PX")) return true;
    return false;
  });
}

function priceFilterActive() {
  return state.maxPrijs < state.defaults.maxPrijs;
}

function matches(r) {
  if (r.score == null) {
    if (!state.inclOnbekend) return false;
  } else if (r.score < state.minScore) {
    return false;
  }
  if (priceFilterActive()) {
    if (r.prijsSample == null || r.prijsSample > state.maxPrijs) return false;
  } else if (r.prijsSample != null && r.prijsSample > state.maxPrijs) {
    return false;
  }
  if (!vatMatch(r.vatTags, state.vat)) return false;
  if (state.rook.size && !state.rook.has(r.rook)) return false;
  if (state.regio.size && !state.regio.has(r.regioKort)) return false;
  if (state.smaak.size && !r.flavour.some(t => state.smaak.has(t))) return false;
  if (state.q) {
    const hay = [
      r.naam, r.vattype, r.regio, r.winkel, r.tweedeWinkel, r.proefnotities,
      r.wbStatus, r.wbReden, r.whiskyfunScore, r.distillerScore, r.opmerkingFles,
      r.flavour.join(" "), r.vatTags.join(" ")
    ].join(" ").toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

function emptyLast(av, bv, a, b) {
  const aEmpty = av == null || av === "", bEmpty = bv == null || bv === "";
  if (aEmpty && bEmpty) return displayName(a.naam).localeCompare(displayName(b.naam), "nl");
  if (aEmpty) return 1;
  if (bEmpty) return -1;
  return null;
}

function cmp(a, b) {
  const key = state.sort;
  let av = a[key], bv = b[key];
  if (key === "naam") { av = displayName(a.naam).toLowerCase(); bv = displayName(b.naam).toLowerCase(); }
  if (key === "rook") { av = rookOrder[a.rook] ?? 9; bv = rookOrder[b.rook] ?? 9; }
  if (key === "score" || key === "flesPrijs" || key === "prijsSample" || key === "inhoud") {
    const early = emptyLast(av, bv, a, b);
    if (early != null) return early;
  }
  let res;
  if (typeof av === "string" && typeof bv === "string") res = av.localeCompare(bv, "nl", { numeric: true });
  else res = (av ?? 0) - (bv ?? 0);
  if (res === 0) res = displayName(a.naam).localeCompare(displayName(b.naam), "nl");
  return state.dir === "asc" ? res : -res;
}

function scoreTier(score) {
  if (score == null) return "unknown";
  if (score >= 90) return "top";
  if (score >= 87) return "high";
  if (score >= 84) return "mid";
  return "low";
}

function scoreBadge(score, extraClass) {
  const cls = "score-badge " + scoreTier(score) + (extraClass ? " " + extraClass : "");
  if (score == null) return '<span class="' + cls + '">onbekend</span>';
  return '<span class="' + cls + '">' + scoreFmt.format(score) + "</span>";
}

function scoreCell(r) {
  const status = r.wbStatus || "onbekend";
  const statusClass = (status === "nog niet opgezocht" || status === "score niet zeker") ? " open" : "";
  const statusLabel = status === "exact" && r.score != null ? "" :
    '<span class="wb-status' + statusClass + '">' + escapeHtml(status) +
    (r.wbReden && status !== "exact" ? " · " + escapeHtml(r.wbReden) : "") +
    "</span>";
  if (r.score == null) {
    return scoreBadge(null) + (statusLabel || '<span class="wb-status">onbekend</span>');
  }
  return scoreBadge(r.score)
    + (r.stemmen != null ? '<span class="votes">' + intFmt.format(r.stemmen) + " stemmen</span>" : "")
    + statusLabel;
}

function criticLine(r) {
  const parts = [];
  if (r.whiskyfunScore) parts.push("WF " + r.whiskyfunScore);
  if (r.distillerScore) parts.push("Distiller " + String(r.distillerScore).split("—")[0].trim());
  return parts.length ? '<span class="crit">' + escapeHtml(parts.join(" · ")) + "</span>" : "";
}

function metaLine(r) {
  const abv = r.abv != null ? num.format(r.abv).replace(",0", "") + "%" : "";
  const extras = [];
  if (r.ncf === "ja") extras.push("NCF");
  else if (r.ncf === "nee") extras.push("koel gefilterd");
  if (r.kleurstof === "nee") extras.push("geen kleurstof");
  else if (r.kleurstof === "ja") extras.push("met kleurstof");
  return [abv, r.regioKort].concat(extras).filter(Boolean).join(" · ");
}

function flesCell(r) {
  if (r.flesPrijs == null) return '<span class="empty">geen prijs bekend</span>';
  const title = r.opmerkingFles ? ' title="' + escapeAttr(r.opmerkingFles) + '"' : "";
  let html = '<span class="price"' + title + ">" + euro.format(r.flesPrijs) + "</span>";
  if (r.winkel) html += '<span class="shop">' + escapeHtml(r.winkel) + "</span>";
  if (r.opVoorraad === "nee") html += '<span class="shop stock-no">niet op voorraad</span>';
  if (r.tweedePrijs != null) {
    html += '<span class="shop">ook ' + escapeHtml(r.tweedeWinkel || "elders") + " " + euro.format(r.tweedePrijs) + "</span>";
  }
  return html;
}

function render(resetPage) {
  if (resetPage) state.shown = PAGE_SIZE;
  els.minScoreVal.textContent = num.format(state.minScore);
  els.maxPrijsVal.textContent = euro.format(state.maxPrijs).replace(",00", "");

  const list = ROWS.filter(matches).sort(cmp);
  const visible = list.slice(0, state.shown);
  const tastedN = list.filter(r => state.tasted[rowId(r)]).length;
  let count = "<strong>" + intFmt.format(list.length) + "</strong> van <strong>" + intFmt.format(ROWS.length) + "</strong> bottelingen";
  if (visible.length < list.length) count += " · " + intFmt.format(visible.length) + " getoond";
  if (tastedN) count += " · " + intFmt.format(tastedN) + " geproefd";
  els.count.innerHTML = count;

  els.rows.innerHTML = visible.map(r => {
    const id = rowId(r);
    const tasted = !!state.tasted[id];
    const name = displayName(r.naam);
    const notes = unknownToEmpty(r.proefnotities);
    const title = notes ? ' title="' + escapeAttr(notes) + '"' : "";
    const meta = metaLine(r);
    const tags = r.flavour.map(t => '<span class="tag">' + escapeHtml(t) + "</span>").join("");
    const vat = unknownToEmpty(r.vattype) || "—";
    const rook = r.rook || "onbekend";
    const sample = r.prijsSample != null
      ? '<span class="price">' + euro.format(r.prijsSample) + "</span>"
      : '<span class="empty">—</span>';
    const inhoud = r.inhoud || (r.sampleBeschikbaar === "nee" ? "geen sample" : "—");
    return '<tr class="' + (tasted ? "tasted" : "") + '" data-slug="' + escapeAttr(r.id) + '">'
      + '<td class="col-check"><label class="geproefd"><input type="checkbox" data-id="' + escapeAttr(id) + '"'
      + (tasted ? " checked" : "") + ' aria-label="Geproefd: ' + escapeAttr(name) + '"></label></td>'
      + "<td><a class=\"name\" href=\"" + escapeAttr(detailHref(r)) + "\"" + title + ">" + escapeHtml(name) + "</a>"
      + (meta ? '<span class="sub">' + escapeHtml(meta) + "</span>" : "")
      + criticLine(r)
      + (tags ? '<div class="tags">' + tags + "</div>" : "")
      + "</td>"
      + '<td class="col-inhoud">' + escapeHtml(inhoud) + "</td>"
      + '<td class="col-prijs">' + sample + "</td>"
      + '<td class="col-score">' + scoreCell(r) + "</td>"
      + '<td><span class="vat" title="' + escapeAttr(vat) + '">' + escapeHtml(vat) + "</span>"
      + '<span class="rook ' + escapeAttr(rook) + '">rook: ' + escapeHtml(rook) + "</span></td>"
      + '<td class="col-fles">' + flesCell(r) + "</td>"
      + "</tr>";
  }).join("");

  els.empty.hidden = list.length > 0;
  document.querySelector("#listView table").style.display = list.length ? "" : "none";
  const remaining = list.length - visible.length;
  els.moreWrap.hidden = remaining <= 0;
  els.more.textContent = remaining > 0
    ? "Toon meer (" + intFmt.format(Math.min(PAGE_SIZE, remaining)) + " van " + intFmt.format(remaining) + " resterend)"
    : "Toon meer";

  document.querySelectorAll("thead th.sortable").forEach(th => {
    const key = th.dataset.sort;
    const sort = key === state.sort ? (state.dir === "asc" ? "ascending" : "descending") : "none";
    th.setAttribute("aria-sort", sort);
    th.querySelector(".arrow").textContent = sort === "ascending" ? "↑" : sort === "descending" ? "↓" : "↕";
  });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function isUrl(value) {
  return /^https?:\/\//i.test(String(value || "").trim());
}

function textOrUnknown(value) {
  const text = unknownToEmpty(value);
  return text ? escapeHtml(text) : '<span class="unknown">onbekend</span>';
}

function moneyOrUnknown(value) {
  return value != null ? escapeHtml(euro.format(value)) : '<span class="unknown">onbekend</span>';
}

function fact(label, valueHtml) {
  return '<div class="fact"><dt>' + escapeHtml(label) + "</dt><dd>" + valueHtml + "</dd></div>";
}

function ncfLabel(value) {
  if (value === "ja") return "ja (ongekoeld gefilterd)";
  if (value === "nee") return "nee (koel gefilterd)";
  return null;
}

function kleurLabel(value) {
  if (value === "ja") return "ja (met kleurstof)";
  if (value === "nee") return "nee (geen kleurstof)";
  return null;
}

function voorraadLabel(value) {
  if (value === "ja") return "ja";
  if (value === "nee") return "nee";
  return null;
}

function extLink(href, title, subtitle) {
  return '<a class="ext-link" href="' + escapeAttr(href) + '" target="_blank" rel="noopener noreferrer">'
    + escapeHtml(title)
    + (subtitle ? "<span>" + escapeHtml(subtitle) + "</span>" : "")
    + "</a>";
}

function detailLinks(r) {
  const links = [];
  const used = new Set();
  function add(href, title, subtitle) {
    if (!href || !isUrl(href) || used.has(href)) return;
    used.add(href);
    links.push(extLink(href, title, subtitle));
  }
  add(r.sampleLink, "Sample kopen", r.prijsSample != null ? ("Whiskysite · " + euro.format(r.prijsSample)) : "Whiskysite");
  add(r.flesLink, "Fles kopen" + (r.winkel ? " bij " + r.winkel : ""), r.flesPrijs != null ? euro.format(r.flesPrijs) : null);
  add(r.tweedeLink, "Fles bij " + (r.tweedeWinkel || "tweede winkel"), r.tweedePrijs != null ? euro.format(r.tweedePrijs) : null);
  add(r.wbLink, "Whiskybase", r.score != null ? ("Score " + scoreFmt.format(r.score)) : null);
  add(r.whiskyfunLink, "Whiskyfun", r.whiskyfunScore || null);
  add(r.distillerLink, "Distiller", r.distillerScore ? String(r.distillerScore).split("—")[0].trim() : null);
  add(r.bronNotities, "Bron proefnotities", null);
  if (!links.length) return '<p class="unknown">Geen externe links bekend.</p>';
  return '<div class="link-list">' + links.join("") + "</div>";
}

function renderDetail(r) {
  const name = displayName(r.naam);
  const id = rowId(r);
  const tasted = !!state.tasted[id];
  document.title = name + " · Whisky proefoverzicht";
  const tags = r.flavour.map(t => '<span class="tag">' + escapeHtml(t) + "</span>").join("");
  const notes = unknownToEmpty(r.proefnotities);
  const source = unknownToEmpty(r.bronNotities);
  const leeftijd = r.leeftijd != null ? escapeHtml(String(r.leeftijd) + " jaar") : '<span class="unknown">onbekend</span>';
  const abv = r.abv != null ? escapeHtml(num.format(r.abv).replace(",0", "") + "%") : '<span class="unknown">onbekend</span>';
  const samplePrijs = r.prijsSample != null ? escapeHtml(euro.format(r.prijsSample)) : '<span class="unknown">onbekend</span>';
  const inhoud = r.inhoud || (r.sampleBeschikbaar === "nee" ? "geen sample" : null);
  const score = r.score != null
    ? escapeHtml(scoreFmt.format(r.score)) + (r.stemmen != null ? " (" + escapeHtml(intFmt.format(r.stemmen)) + " stemmen)" : "")
    : '<span class="unknown">onbekend</span>';
  const wbStatus = escapeHtml(r.wbStatus || "onbekend")
    + (unknownToEmpty(r.wbReden) ? " · " + escapeHtml(r.wbReden) : "");
  const distiller = unknownToEmpty(r.distillerScore);

  els.detail.innerHTML =
    '<div class="detail-head"><div>'
    + "<h2>" + escapeHtml(name) + "</h2>"
    + (r.naam !== name ? '<span class="sub">' + escapeHtml(r.naam) + "</span>" : "")
    + (tags ? '<div class="tags">' + tags + "</div>" : "")
    + '</div><div class="detail-aside">'
    + scoreBadge(r.score, "large")
    + '<label class="taste-check"><input type="checkbox" data-id="' + escapeAttr(id) + '"'
    + (tasted ? " checked" : "") + '> Geproefd</label></div></div>'
    + '<div class="facts">'
    + fact("Leeftijd", leeftijd)
    + fact("ABV", abv)
    + fact("Regio / stijl", textOrUnknown(r.regio))
    + fact("Vattype", textOrUnknown(r.vattype))
    + fact("Rookniveau", textOrUnknown(r.rook))
    + fact("Ongekoeld gefilterd", textOrUnknown(ncfLabel(r.ncf) || r.ncf))
    + fact("Kleurstof", textOrUnknown(kleurLabel(r.kleurstof) || r.kleurstof))
    + fact("Sample beschikbaar", textOrUnknown(r.sampleBeschikbaar))
    + fact("Sample-grootte", textOrUnknown(inhoud))
    + fact("Sampleprijs", samplePrijs)
    + fact("Whiskybase-score", score)
    + fact("WB-status", wbStatus)
    + fact("Whiskyfun", textOrUnknown(r.whiskyfunScore))
    + fact("Distiller", textOrUnknown(distiller))
    + fact("Flesprijs", moneyOrUnknown(r.flesPrijs))
    + fact("Flesgrootte", textOrUnknown(r.flesGrootte))
    + fact("Winkel", textOrUnknown(r.winkel))
    + fact("Op voorraad", textOrUnknown(voorraadLabel(r.opVoorraad) || r.opVoorraad))
    + fact("Gecontroleerd op", textOrUnknown(r.gecontroleerdOp))
    + fact("Tweede winkel", r.tweedeWinkel || r.tweedePrijs != null
        ? escapeHtml((r.tweedeWinkel || "onbekend") + (r.tweedePrijs != null ? " · " + euro.format(r.tweedePrijs) : ""))
        : '<span class="unknown">onbekend</span>')
    + fact("Opmerking fles", textOrUnknown(r.opmerkingFles))
    + "</div>"
    + '<div class="block"><h3>Proefnotities</h3>'
    + '<div class="notes">' + (notes ? escapeHtml(notes) : '<span class="unknown">onbekend</span>') + "</div>"
    + (source && !isUrl(source) ? '<span class="notes-source">Bron: ' + escapeHtml(source) + "</span>" : "")
    + "</div>"
    + '<div class="block" id="links"><h3>Links</h3>' + detailLinks(r) + "</div>";
}

function renderDetailMissing() {
  document.title = "Niet gevonden · Whisky proefoverzicht";
  els.detail.innerHTML = '<div class="missing"><h2>Whisky niet gevonden</h2>'
    + '<p>Deze link wijst niet naar een botteling in het overzicht.</p></div>';
}

function parseHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  const path = decodeURIComponent(raw).replace(/^\/+/, "");
  if (!path || path === "/") return null;
  const match = path.match(/^whisky\/([^/]+)$/);
  return match ? match[1] : null;
}

function rememberListScroll() {
  if (parseHash()) return;
  listScroll = { table: els.tableWrap.scrollTop, window: window.scrollY };
}

function restoreListScroll() {
  if (!listScroll) return;
  const saved = listScroll;
  requestAnimationFrame(() => {
    els.tableWrap.scrollTop = saved.table;
    window.scrollTo(0, saved.window);
  });
}

function route() {
  const id = parseHash();
  if (id) {
    const row = ROWS.find(r => r.id === id);
    document.body.classList.add("detail-mode");
    els.listView.hidden = true;
    els.detailView.hidden = false;
    if (row) renderDetail(row);
    else renderDetailMissing();
    window.scrollTo(0, 0);
    return;
  }
  document.body.classList.remove("detail-mode");
  els.detailView.hidden = true;
  els.listView.hidden = false;
  document.title = "Whisky · Sample-overzicht";
  render(false);
  restoreListScroll();
}

function applyBounds(items) {
  const scores = items.map(r => r.score).filter(v => v != null);
  const prices = items.map(r => r.prijsSample).filter(v => v != null);
  const scoreMin = scores.length ? Math.floor(Math.min(...scores) * 10) / 10 : 60;
  const scoreMax = scores.length ? Math.ceil(Math.max(...scores) * 10) / 10 : 92;
  const prijsMin = prices.length ? Math.floor(Math.min(...prices)) : 1;
  const prijsMax = prices.length ? Math.ceil(Math.max(...prices)) : 100;
  state.defaults = { minScore: scoreMin, maxPrijs: prijsMax, scoreMin, scoreMax, prijsMin, prijsMax };
  state.minScore = scoreMin;
  state.maxPrijs = prijsMax;
  els.minScore.min = scoreMin;
  els.minScore.max = scoreMax;
  els.minScore.step = "0.1";
  els.minScore.value = scoreMin;
  els.maxPrijs.min = prijsMin;
  els.maxPrijs.max = prijsMax;
  els.maxPrijs.value = prijsMax;
  els.minScore.disabled = false;
  els.maxPrijs.disabled = false;
  els.inclOnbekend.checked = true;
  state.inclOnbekend = true;
}

function initPills() {
  makePills(document.getElementById("vat-pills"), uniqueInOrder(ROWS.flatMap(r => r.vatTags), VAT_ORDER), "vat");
  makePills(document.getElementById("rook-pills"), uniqueInOrder(ROWS.map(r => r.rook).filter(r => ROOK_ORDER.includes(r)), ROOK_ORDER), "rook");
  makePills(document.getElementById("regio-pills"), uniqueInOrder(ROWS.map(r => r.regioKort), REGIO_ORDER), "regio");
  makePills(document.getElementById("smaak-pills"), uniqueInOrder(ROWS.flatMap(r => r.flavour), FLAVOUR.map(f => f.label)), "smaak");
}

function setTasted(id, checked) {
  if (checked) state.tasted[id] = true;
  else delete state.tasted[id];
  saveTasted(state.tasted);
}

function bindEvents() {
  els.q.addEventListener("input", () => { state.q = els.q.value.trim().toLowerCase(); render(true); });
  els.minScore.addEventListener("input", () => { state.minScore = Number(els.minScore.value); render(true); });
  els.maxPrijs.addEventListener("input", () => { state.maxPrijs = Number(els.maxPrijs.value); render(true); });
  els.inclOnbekend.addEventListener("change", () => { state.inclOnbekend = els.inclOnbekend.checked; render(true); });
  els.more.addEventListener("click", () => { state.shown += PAGE_SIZE; render(false); });
  els.tableWrap.addEventListener("scroll", rememberListScroll, { passive: true });
  window.addEventListener("scroll", rememberListScroll, { passive: true });

  document.querySelectorAll(".pills").forEach(group => {
    group.addEventListener("click", (e) => {
      const btn = e.target.closest(".pill");
      if (!btn) return;
      const key = btn.dataset.group;
      const value = btn.dataset.value;
      if (state[key].has(value)) state[key].delete(value);
      else state[key].add(value);
      group.querySelectorAll(".pill").forEach(p => p.setAttribute("aria-pressed", state[key].has(p.dataset.value) ? "true" : "false"));
      render(true);
    });
  });

  document.querySelectorAll("thead th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (state.sort === key) state.dir = state.dir === "asc" ? "desc" : "asc";
      else { state.sort = key; state.dir = key === "naam" ? "asc" : "desc"; }
      render(true);
    });
  });

  els.rows.addEventListener("change", (e) => {
    const input = e.target.closest("input[data-id]");
    if (!input) return;
    setTasted(input.dataset.id, input.checked);
    render(false);
  });

  els.rows.addEventListener("click", (e) => {
    if (e.target.closest("input, label.geproefd")) return;
    const nameLink = e.target.closest("a.name");
    if (nameLink) { rememberListScroll(); return; }
    const tr = e.target.closest("tr[data-slug]");
    if (!tr) return;
    rememberListScroll();
    location.hash = "#/whisky/" + tr.dataset.slug;
  });

  els.detailView.addEventListener("change", (e) => {
    const input = e.target.closest("input[data-id]");
    if (!input) return;
    setTasted(input.dataset.id, input.checked);
  });

  document.querySelectorAll('a[href="#/"]').forEach(a => {
    a.addEventListener("click", () => {
      if (parseHash()) return;
      rememberListScroll();
    });
  });

  els.reset.addEventListener("click", () => {
    state.q = "";
    state.vat = new Set();
    state.rook = new Set();
    state.regio = new Set();
    state.smaak = new Set();
    state.minScore = state.defaults.minScore;
    state.maxPrijs = state.defaults.maxPrijs;
    state.inclOnbekend = true;
    els.q.value = "";
    els.minScore.value = state.defaults.minScore;
    els.maxPrijs.value = state.defaults.maxPrijs;
    els.inclOnbekend.checked = true;
    document.querySelectorAll(".pill").forEach(p => p.setAttribute("aria-pressed", "false"));
    render(true);
  });

  window.addEventListener("hashchange", route);
}

async function runSmoke() {
  const report = { errors: jsErrors.slice(), total: ROWS.length };
  report.initialHash = location.hash;
  report.startOnDetail = !els.detailView.hidden;
  if (report.startOnDetail) {
    report.deepLinkName = (els.detail.querySelector("h2") || {}).textContent || "";
    report.deepLinkHasLinks = !!els.detail.querySelector("#links .ext-link, #links .unknown");
    report.deepLinkExternal = [...els.detail.querySelectorAll("a[href^='http']")].map(a => ({
      href: a.getAttribute("href"), target: a.getAttribute("target")
    }));
    report.deepLinkAllNewTab = report.deepLinkExternal.every(a => a.target === "_blank");
    location.hash = "#/";
    route();
  }

  report.initialCountText = els.count.textContent;
  report.initialRows = els.rows.querySelectorAll("tr").length;
  report.moreVisible = !els.moreWrap.hidden;
  const scored = ROWS.filter(r => r.score != null).length;
  els.inclOnbekend.checked = false;
  state.inclOnbekend = false;
  render(true);
  report.withoutUnknown = ROWS.filter(matches).length;
  report.scoredTotal = scored;
  els.inclOnbekend.checked = true;
  state.inclOnbekend = true;
  render(true);

  report.noSampleCount = ROWS.filter(r => r.prijsSample == null).length;
  report.atMaxPrice = ROWS.filter(matches).length;
  state.maxPrijs = state.defaults.maxPrijs - 1;
  els.maxPrijs.value = state.maxPrijs;
  render(true);
  const after = ROWS.filter(matches);
  report.afterPriceFilter = after.length;
  report.afterPriceFilterHasNoSample = after.some(r => r.prijsSample == null);
  report.afterPriceFilterOverMax = after.some(r => r.prijsSample > state.maxPrijs);
  report.afterPriceFilterExpected = ROWS.filter(r => r.prijsSample != null && r.prijsSample <= state.maxPrijs && (r.score == null ? state.inclOnbekend : r.score >= state.minScore)).length;
  document.getElementById("reset").click();

  const rookBtn = document.querySelector('.pill[data-group="rook"][data-value="geen"]');
  if (rookBtn) rookBtn.click();
  report.afterRookGeen = ROWS.filter(matches).length;
  document.getElementById("reset").click();
  els.q.value = "glenfarclas";
  state.q = "glenfarclas";
  render(true);
  report.afterSearchGlenfarclas = ROWS.filter(matches).length;
  report.filtersBeforeDetail = state.q;
  const firstLink = els.rows.querySelector("a.name");
  report.listNameHref = firstLink ? firstLink.getAttribute("href") : null;
  report.listExternalLinks = [...els.listView.querySelectorAll("a")].map(a => a.getAttribute("href")).filter(h => /^https?:/i.test(h || ""));
  rememberListScroll();
  const targetId = (ROWS.find(r => r.id === "glengoyne-30-years-old") || ROWS[0]).id;
  location.hash = "#/whisky/" + targetId;
  route();
  report.detailVisible = !els.detailView.hidden && els.listView.hidden;
  report.detailName = (els.detail.querySelector("h2") || {}).textContent || "";
  report.detailHasLinksSection = !!els.detail.querySelector("#links");
  report.detailExternal = [...els.detail.querySelectorAll("a[href^='http']")].map(a => a.getAttribute("target"));
  report.detailExternalAllNewTab = report.detailExternal.length > 0 && report.detailExternal.every(t => t === "_blank");
  location.hash = "#/";
  route();
  report.listVisibleAfterBack = !els.listView.hidden && els.detailView.hidden;
  report.filtersAfterBack = state.q;
  document.getElementById("reset").click();
  location.hash = "#/whisky/bestaat-niet";
  route();
  report.missingShown = /niet gevonden/i.test(els.detailView.innerText);
  location.hash = "#/";
  route();
  report.previewNotePresent = /Voorbeeld met een selectie/i.test(document.body.innerText);
  report.hasPersonalCol = /Past bij smaak/i.test(document.body.innerText);
  report.errors = jsErrors.slice();
  const flag = document.createElement("pre");
  flag.id = "smoke-report";
  flag.textContent = JSON.stringify(report);
  document.body.appendChild(flag);
  window.__SMOKE__ = report;
}

bindEvents();

fetch("data.json")
  .then(res => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then(payload => {
    const items = Array.isArray(payload) ? payload : (payload.items || []);
    ROWS = items.map(enrich);
    applyBounds(ROWS);
    initPills();
    els.status.hidden = true;
    route();
    if (new URLSearchParams(location.search).has("smoke")) return runSmoke();
  })
  .catch(err => {
    els.status.classList.add("error");
    els.status.textContent = "De gegevens konden niet worden geladen. Controleer of data.json naast deze pagina staat.";
    jsErrors.push(String(err));
  });
</script>
</body>
</html>
